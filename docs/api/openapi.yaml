  /drivers/{driverId}/approval:
    post:
      operationId: decideDriverRegistration
      summary: 기사 가입 승인 또는 반려
      description: >-
        관리자가 승인(APPROVE) 또는 반려(REJECT)를 확정한다. 처리 시점에 사업자 검증 성공과 계정의 PENDING_APPROVAL 상태를 다시 확인하고, 둘 다 충족할 때만
        APPROVED로 바꾼다. 하나라도 충족하지 못하면 상태를 바꾸지 않고 409(APPROVAL_PRECONDITION_FAILED)로 사유를 알린다. 이미 승인·반려된 같은 신청을 다시 처리하면 409
        (DRIVER_ALREADY_DECIDED)다. 반려 후 재신청해서 승인 대기가 된 새 신청은 다시 처리할 수 있다. REJECT에는 rejectionReason이 필수이며 기사에게 푸시로 통보한다.
        기사에게 알림을 보내지 못해도 결정 자체는 취소되지 않는다.
      tags:
        - DriverAccounts
      x-business-rules:
        - BR-01
        - BR-02
        - BR-03
      x-requirements:
        - FR-13
        - UC-06
      x-roles:
        - ADMIN
      parameters:
        - $ref: "#/components/parameters/DriverIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DriverApprovalRequest"}
            examples:
              approve:
                summary: 승인
                value: {expectedVersion: 1, decision: APPROVE}
              reject:
                summary: 반려(사유 필수)
                value: {expectedVersion: 1, decision: REJECT, rejectionReason: 사업자 정보를 다시 확인해 주세요.}
      responses:
        "200":
          description: 처리 결과.
          headers:
            Idempotency-Replayed:
              description: 성공 응답 재현이면 true. 최초 성공은 false 또는 생략.
              schema: {type: boolean}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DriverApprovalResult"}
              example: {driverId: drv_02, accountStatus: APPROVED, version: 2, decidedAt: "2026-11-02T14:00:00+09:00"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: 버전 충돌, 이미 처리된 신청(E2), 승인 조건 미충족, 또는 멱등성 충돌.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              examples:
                alreadyDecided:
                  summary: 이미 승인·반려됨(E2)
                  value:
                    code: DRIVER_ALREADY_DECIDED
                    message: 이미 처리된 신청입니다.
                    traceId: trace_example_01
                    currentState: {accountStatus: APPROVED}
                preconditionFailed:
                  summary: 사업자 검증 미성공 또는 승인 대기 상태 아님
                  value:
                    code: APPROVAL_PRECONDITION_FAILED
                    message: 승인 조건을 충족하지 않습니다.
                    traceId: trace_example_01
                versionConflict:
                  summary: 버전 불일치
                  value: {code: VERSION_CONFLICT, message: 최신 버전과 상태를 다시 조회해 주세요., traceId: trace_example_01}
        "422":
          description: 반려인데 rejectionReason이 없는 경우 등 입력 오류.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example:
                code: VALIDATION_FAILED
                message: 입력값을 확인해 주세요.
                traceId: trace_example_01
                fieldErrors: [{field: rejectionReason, message: 반려 시 사유가 필요합니다.}]

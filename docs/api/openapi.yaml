      summary: 현재 배정과 최초 배차·재배차 이력 조회
      description: >-
        round sequence 순서와 각 회차의 배정/취소/해제/후속 결정 이벤트를 반환한다. currentAssignment는 현재 ACTIVE 배정이며 없으면 null. 과거 배정은
        재배차 후에도 보존하되 기사 탈퇴 관련 데이터는 UC-15의 접근 통제·보존·파기 정책을 따른다. 조회는 기존 의뢰 데이터를 변경하지 않는다.
        의뢰가 없으면 404, 존재하는 의뢰의 이력이 없으면 200과 빈 rounds를 반환한다. 현재 배정이 없으면 currentAssignment는 null이다.
        최신 접수 정보·작업 유형·현재 배차 상태·작업 진행 상태·기사별 전달 결과는 후속 상세/회차 조회 계약의 범위이며 이 이력 응답으로 대체하지 않는다.
        대규모 이력 페이지네이션은 후속 결정.

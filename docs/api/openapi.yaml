        기사 본인과 관리자 사이의 1:1 대화 이력을 최신순으로 돌려준다. before로 더 오래된 메시지를 이어서 가져온다. 상대 메시지는 앱이 열려 있으면 실시간 연결로 받고,
        연결이 불가능하면 푸시 알림으로 알린 뒤 이 API로 확인한다. 승인 대기·반려·탈퇴 기사는 일반 채팅에 접근할 수 없다.
      tags:
        - Chat
      x-business-rules:
        - BR-02
      x-requirements:
        - FR-15
        - UC-16
      x-roles:
        - DRIVER
      parameters:
        - $ref: "#/components/parameters/ChatBefore"
        - $ref: "#/components/parameters/ChatLimit"
      responses:
        "200":
          description: 메시지 이력.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatMessagePage"}
              example:
                items:
                  - {messageId: msg_02, driverId: drv_01, sender: ADMIN, body: 현장 상황을 알려 주세요., sentAt: "2026-10-31T14:30:00+09:00", readAt: null}
                  - {messageId: msg_01, driverId: drv_01, sender: DRIVER, body: 도착했습니다., sentAt: "2026-10-31T14:10:00+09:00", readAt: "2026-10-31T14:11:00+09:00"}
                nextCursor: null
                readOnly: false
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    post:
      operationId: sendMyChatMessage
      summary: 관리자에게 메시지 전송(기사)
      description: >-
        기사가 관리자에게 텍스트 메시지를 보낸다. Idempotency-Key는 클라이언트가 만든 메시지 전송 식별자로 쓴다. 전송 결과를 확인하지 못했을 때 같은 키로 재전송해도 메시지가 중복
        저장되지 않고 최초 응답이 재현된다(UC-16 E1). 전송 시점에 계정이 APPROVED가 아니면 403(CHAT_NOT_ALLOWED)이다(E3). 실시간 전송(WebSocket) 계약은 미결정이며 이 REST API가
        저장과 이력의 기준이다.
      tags:
        - Chat
      x-business-rules:
        - BR-02
        - BR-03
      x-requirements:
        - FR-15
        - UC-16
      x-roles:
        - DRIVER
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SendChatMessage"}
            example: {body: 도착했습니다.}
      responses:
        "201":
          description: 저장된 메시지.
          headers:
            Idempotency-Replayed:
              description: 성공 응답 재현이면 true. 최초 성공은 false 또는 생략.
              schema: {type: boolean}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatMessage"}
              example: {messageId: msg_01, driverId: drv_01, sender: DRIVER, body: 도착했습니다., sentAt: "2026-10-31T14:10:00+09:00", readAt: null}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: 계정 상태가 활성이 아니거나 채팅 권한이 없다.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example: {code: CHAT_NOT_ALLOWED, message: 현재 채팅을 이용할 수 없습니다., traceId: trace_example_01}
        "409": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /drivers/me/chat/read:
    put:
      operationId: markMyChatRead
      summary: 관리자 메시지 읽음 처리(기사)
      description: 기사가 마지막으로 읽은 메시지까지 읽음으로 표시한다. 같은 요청을 반복해도 결과가 같으므로 Idempotency-Key를 요구하지 않는다. 더 앞 메시지를 가리키면 읽음 위치는 뒤로 가지 않는다.
      tags:
        - Chat
      x-business-rules:
        - BR-02
      x-requirements:
        - FR-15
        - UC-16
      x-roles:
        - DRIVER
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatReadRequest"}
            example: {lastReadMessageId: msg_02}
      responses:
        "200":
          description: 읽음 위치.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatReadState"}
              example: {lastReadMessageId: msg_02, readAt: "2026-10-31T14:31:00+09:00"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /chat-rooms:
    get:
      operationId: listChatRooms
      summary: 기사별 채팅방 목록(관리자)
      description: >-
        관리자가 기사별 1:1 채팅방과 마지막 메시지, 읽지 않은 수를 확인한다. 승인 대기·반려·탈퇴 기사의 방은 readOnly=true이며 권한 있는 관리자가 과거 이력만 읽을 수 있고 새 메시지는 보낼 수 없다.
        보존 정책과 열람 권한은 UC-15를 따른다.
      tags:
        - Chat
      x-business-rules:
        - BR-02
      x-requirements:
        - FR-15
        - UC-16
      x-roles:
        - ADMIN
      parameters:
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 채팅방 목록.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatRoomList"}
              example:
                items:
                  - driver: {driverId: drv_01, workerName: 홍길동}
                    driverAccountStatus: APPROVED
                    lastMessage: {messageId: msg_01, driverId: drv_01, sender: DRIVER, body: 도착했습니다., sentAt: "2026-10-31T14:10:00+09:00", readAt: null}
                    unreadCount: 1
                    readOnly: false
                page: {page: 1, size: 20, totalElements: 1, totalPages: 1}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /chat-rooms/{driverId}/messages:
    get:
      operationId: listChatMessages
      summary: 기사와의 채팅 이력 조회(관리자)
      description: >-
        특정 기사와의 대화 이력을 최신순으로 돌려준다. 기사 계정이 활성이 아니어도 권한 있는 관리자는 과거 이력을 읽기 전용으로 조회할 수 있고 이때 readOnly가 true다.
      tags:
        - Chat
      x-business-rules:
        - BR-02
      x-requirements:
        - FR-15
        - UC-16
      x-roles:
        - ADMIN
      parameters:
        - $ref: "#/components/parameters/DriverIdPath"
        - $ref: "#/components/parameters/ChatBefore"
        - $ref: "#/components/parameters/ChatLimit"
      responses:
        "200":
          description: 메시지 이력.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatMessagePage"}
              example:
                items:
                  - {messageId: msg_01, driverId: drv_01, sender: DRIVER, body: 도착했습니다., sentAt: "2026-10-31T14:10:00+09:00", readAt: null}
                nextCursor: null
                readOnly: false
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    post:
      operationId: sendChatMessage
      summary: 기사에게 메시지 전송(관리자)
      description: >-
        관리자가 기사에게 텍스트 메시지를 보낸다. Idempotency-Key는 메시지 전송 식별자이며 같은 키 재전송은 중복 저장되지 않는다. 전송 시점에 기사 계정이 APPROVED가 아니면
        (승인 대기·반려·탈퇴) 403(CHAT_NOT_ALLOWED)이다(UC-16 E3). 상대가 화면을 보고 있지 않으면 푸시 알림으로 전달한다(A1).
      tags:
        - Chat
      x-business-rules:
        - BR-02
        - BR-03
      x-requirements:
        - FR-15
        - UC-16
      x-roles:
        - ADMIN
      parameters:
        - $ref: "#/components/parameters/DriverIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SendChatMessage"}
            example: {body: 현장 상황을 알려 주세요.}
      responses:
        "201":
          description: 저장된 메시지.
          headers:
            Idempotency-Replayed:
              description: 성공 응답 재현이면 true. 최초 성공은 false 또는 생략.
              schema: {type: boolean}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatMessage"}
              example: {messageId: msg_02, driverId: drv_01, sender: ADMIN, body: 현장 상황을 알려 주세요., sentAt: "2026-10-31T14:30:00+09:00", readAt: null}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: 기사 계정이 활성이 아니거나 채팅 권한이 없다.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example: {code: CHAT_NOT_ALLOWED, message: 현재 이 기사와 채팅할 수 없습니다., traceId: trace_example_01}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/VersionConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /chat-rooms/{driverId}/read:
    put:
      operationId: markChatRead
      summary: 기사 메시지 읽음 처리(관리자)
      description: 관리자가 마지막으로 읽은 메시지까지 읽음으로 표시한다. 같은 요청을 반복해도 결과가 같으므로 Idempotency-Key를 요구하지 않는다.
      tags:
        - Chat
      x-business-rules:
        - BR-02
      x-requirements:
        - FR-15
        - UC-16
      x-roles:
        - ADMIN
      parameters:
        - $ref: "#/components/parameters/DriverIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatReadRequest"}
            example: {lastReadMessageId: msg_01}
      responses:
        "200":
          description: 읽음 위치.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatReadState"}
              example: {lastReadMessageId: msg_01, readAt: "2026-10-31T14:12:00+09:00"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        액세스 토큰(Bearer)으로 API를 인증하고 리프레시 토큰으로 갱신한다(FR-01). 관리자는 아이디·비밀번호와 MFA(TOTP)를 모두 통과해야 토큰을 받는다. x-roles의 ADMIN은 관리자, DRIVER는 계정이 APPROVED인 기사, DRIVER_ANY_STATUS는 승인 대기·반려·미가입 기사를 포함한 모든 기사 토큰을 뜻한다. 역할과 리소스 관계, 기사 계정 상태는 요청 시점에 서버가 최신 상태로 다시 검증하며 토큰의 과거 권한만 신뢰하지 않는다. 토큰 수명, JWT 여부 등 세부는 구현 시 확정한다. 마스터/부 관리자별 권한 차등은 미확정이다. 로그인 전 API는 security: []로 표시했다.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 동일 업무의 재시도 동안 유지. 같은 키 다른 본문은 409. 키 보존 기간은 추후 확정.
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: client-operation-001
    PageNumber:
      name: page
      in: query
      description: 1부터 시작하는 페이지 번호.
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: size
      in: query
      description: 페이지 크기.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    ReceptionIdPath:
      name: receptionId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Id"}
      example: rec_01
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Id"}
      example: req_01
    DriverIdPath:
      name: driverId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Id"}
      example: drv_01
    OfferIdPath:
      name: offerId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Id"}
      example: ofr_01
    AssignmentIdPath:
      name: assignmentId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Id"}
      example: asg_01
    CancellationIdPath:
      name: cancellationId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Id"}
      example: can_01
    FileIdPath:
      name: fileId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Id"}
      example: file_01
    ChatBefore:
      name: before
      in: query
      description: 이 메시지 ID보다 오래된 메시지를 조회하는 커서. 생략하면 최신 메시지부터 조회.
      schema: {$ref: "#/components/schemas/Id"}
    ChatLimit:
      name: limit
      in: query
      description: 한 번에 가져올 메시지 수.
      schema: {type: integer, minimum: 1, maximum: 100, default: 30}
  responses:
    Unauthorized:
      description: 인증이 필요하거나 토큰이 만료·무효입니다.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {code: UNAUTHENTICATED, message: 인증이 필요합니다., traceId: trace_example_01}
    Forbidden:
      description: 이 작업을 수행할 권한이 없습니다. 역할, 계정 상태, 대상 리소스와의 관계를 서버가 요청 시점에 확인합니다.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {code: FORBIDDEN, message: 이 작업을 수행할 권한이 없습니다., traceId: trace_example_01}
    NotFound:
      description: 리소스를 찾을 수 없거나 조회 권한이 없습니다.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {code: NOT_FOUND, message: 리소스를 찾을 수 없습니다., traceId: trace_example_01}
    VersionConflict:
      description: >-
        상태 충돌입니다. 가장 흔한 경우는 VERSION_CONFLICT(expectedVersion 불일치)이며 멱등성 충돌(IDEMPOTENCY_KEY_REUSED, OPERATION_IN_PROGRESS)도 이 코드로 반환합니다.
        OPERATION_IN_PROGRESS일 때만 Retry-After 헤더를 제공합니다.
      headers:
        Retry-After:
          description: OPERATION_IN_PROGRESS일 때 재시도 대기 초. 그 외 충돌에는 생략.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            versionConflict:
              summary: 버전 불일치
              value: {code: VERSION_CONFLICT, message: 최신 버전과 상태를 다시 조회해 주세요., traceId: trace_example_01}
            idempotencyKeyReused:
              summary: 같은 키로 다른 본문
              value: {code: IDEMPOTENCY_KEY_REUSED, message: 같은 키로 다른 요청을 보낼 수 없습니다., traceId: trace_example_01}
            operationInProgress:
              summary: 같은 키의 요청 처리 중
              value: {code: OPERATION_IN_PROGRESS, message: 처리 중입니다. 잠시 후 다시 시도해 주세요., traceId: trace_example_01}
    ValidationFailed:
      description: 입력값 오류. 어느 필드가 문제인지 fieldErrors로 알려줍니다.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            code: VALIDATION_FAILED
            message: 입력값을 확인해 주세요.
            traceId: trace_example_01
            fieldErrors:
              - {field: address, message: 필수 항목입니다.}
    TooManyRequests:
      description: 요청이 너무 많습니다. Retry-After 이후 다시 시도합니다. 제한 수치는 미정.
      headers:
        Retry-After:
          description: 재시도 대기 초.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {code: RATE_LIMITED, message: 잠시 후 다시 시도해 주세요., traceId: trace_example_01}
    ServiceUnavailable:
      description: 일시 장애입니다. 조회 실패를 빈 결과로 표시하지 않고 오류로 안내합니다.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {code: TEMPORARILY_UNAVAILABLE, message: 일시 장애입니다. 잠시 후 다시 시도해 주세요., traceId: trace_example_01}
  schemas:
    ReceptionFields:
      type: object
      additionalProperties: false
      required:
        - workType
        - symptoms
        - address
        - desiredVisitFrom
        - desiredVisitTo
      properties:
        workType:
          type: string
          enum:
            - EXTERIOR_LEAK
            - INTERIOR_LEAK
            - BLOCKAGE
        symptoms:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        desiredVisitFrom:
          type: string
          format: date-time
        desiredVisitTo:
          type: string
          format: date-time
        notes:
          type: string
    ConfirmReception:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
    ConfirmedReception:
      type: object
      additionalProperties: false
      required:
        - receptionId
        - reviewStatus
        - version
        - confirmedAt
        - finalData
      properties:
        receptionId:
          type: string
          minLength: 1
        reviewStatus:
          const: CONFIRMED
          type: string
        version:
          type: integer
          minimum: 1
        confirmedAt:
          type: string
          format: date-time
        finalData:
          $ref: "#/components/schemas/ReceptionFields"
    CreateRequest:
      type: object
      additionalProperties: false
      required:
        - receptionId
        - receptionVersion
      properties:
        receptionId:
          type: string
          minLength: 1
        receptionVersion:
          type: integer
          minimum: 1
    RequestCreated:
      type: object
      additionalProperties: false
      required:
        - requestId
        - requestStatus
        - dispatchRoundId
        - dispatchStatus
        - version
      properties:
        requestId:
          type: string
          minLength: 1
        requestStatus:
          const: OPEN
          type: string
        dispatchRoundId:
          type: string
          minLength: 1
        dispatchStatus:
          const: SEARCHING
          type: string
        version:
          type: integer
          minimum: 1
    OfferResponse:
      type: object
      additionalProperties: false
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - ACCEPT
            - REJECT
    AssignmentAccepted:
      type: object
      additionalProperties: false
      required:
        - offerId
        - offerStatus
        - requestId
        - assignmentId
        - assignmentStatus
        - workStatus
        - version
      properties:
        offerId:
          type: string
          minLength: 1
        offerStatus:
          const: ACCEPTED
          type: string
        requestId:
          type: string
          minLength: 1
        assignmentId:
          type: string
          minLength: 1
        assignmentStatus:
          const: POSSIBLE
          type: string
        workStatus:
          $ref: "#/components/schemas/WorkStatus"
        version:
          type: integer
          minimum: 1
    OfferRejected:
      type: object
      additionalProperties: false
      required:
        - offerId
        - offerStatus
      properties:
        offerId:
          type: string
          minLength: 1
        offerStatus:
          const: REJECTED
          type: string
    WorkStatus:
      type: string
      description: WORK_DONE는 최초 보고서 제출 성공. TRANSFERRED는 담당자 인계로 기존 작업을 종료하기 위한 설계 제안이며 완료 집계에서 제외한다.
      enum:
        - NOT_STARTED
        - EN_ROUTE
        - ARRIVED
        - IN_PROGRESS
        - REVISIT_REQUIRED
        - WORK_DONE
        - TRANSFERRED
    WorkTransition:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - targetStatus
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        targetStatus:
          type: string
          description: WORK_DONE는 보고서 제출 성공, TRANSFERRED는 별도 인계 처리로 변경한다.
          enum:
            - NOT_STARTED
            - EN_ROUTE
            - ARRIVED
            - IN_PROGRESS
            - REVISIT_REQUIRED
        reason:
          type: string
          minLength: 1
    WorkTransitioned:
      type: object
      additionalProperties: false
      required:
        - assignmentId
        - assignmentStatus
        - workStatus
        - version
        - updatedAt
      properties:
        assignmentId:
          type: string
          minLength: 1
        assignmentStatus:
          const: POSSIBLE
          type: string
        workStatus:
          $ref: "#/components/schemas/WorkStatus"
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    CreateCancellation:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - reasonCode
        - reasonDetail
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reasonCode:
          type: string
          enum:
            - SCHEDULE_CONFLICT
            - EQUIPMENT_UNAVAILABLE
            - TRAVEL_ISSUE
            - CUSTOMER_UNREACHABLE
            - OTHER
        reasonDetail:
          type: string
          minLength: 1
          maxLength: 1000
    CancellationCreated:
      type: object
      additionalProperties: false
      required:
        - cancellationId
        - resolutionStatus
        - assignmentId
        - assignmentStatus
        - requestId
        - requestStatus
        - releasedAt
        - version
      properties:
        cancellationId:
          type: string
          minLength: 1
        resolutionStatus:
          const: PENDING
          type: string
        assignmentId:
          type: string
          minLength: 1
        assignmentStatus:
          const: RELEASED
          type: string
        requestId:
          type: string
          minLength: 1
        requestStatus:
          const: OPEN
          type: string
        releasedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    ResolveCancellation:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - decision
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        decision:
          type: string
          enum:
            - REDISPATCH
            - CANCEL_REQUEST
    Resolution:
      type: object
      additionalProperties: false
      required:
        - cancellationId
        - resolutionStatus
        - requestId
        - requestStatus
        - dispatchRoundId
        - version
        - resolvedAt
      properties:
        cancellationId:
          type: string
          minLength: 1
        resolutionStatus:
          type: string
          enum:
            - REDISPATCH
            - CANCEL_REQUEST
        requestId:
          type: string
          minLength: 1
        requestStatus:
          type: string
          enum:
            - OPEN
            - CANCELLED
        dispatchRoundId:
          type:
            - string
            - "null"
        version:
          type: integer
          minimum: 1
        resolvedAt:
          type: string
          format: date-time
    ReportData:
      type: object
      additionalProperties: false
      required:
        - workDescription
        - diagnosis
        - beforePhotoIds
        - afterPhotoIds
        - totalCost
      properties:
        workDescription:
          type: string
          minLength: 1
        diagnosis:
          type: string
          minLength: 1
        beforePhotoIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        afterPhotoIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        totalCost:
          type: integer
          minimum: 0
    SubmitReport:
      type: object
      additionalProperties: false
      required:
        - totalCost
        - expectedVersion
        - workDescription
        - diagnosis
        - beforePhotoIds
        - afterPhotoIds
      properties:
        totalCost:
          type: integer
          minimum: 0
        expectedVersion:
          type: integer
          minimum: 1
        workDescription:
          type: string
          minLength: 1
        diagnosis:
          type: string
          minLength: 1
        beforePhotoIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        afterPhotoIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
    ReportCreated:
      type: object
      additionalProperties: false
      required:
        - reportId
        - assignmentId
        - version
        - submittedAt
        - original
      properties:
        reportId:
          type: string
          minLength: 1
        assignmentId:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        submittedAt:
          type: string
          format: date-time
        original:
          $ref: "#/components/schemas/ReportData"
    ReportChanges:
      type: object
      additionalProperties: false
      required: []
      properties:
        totalCost:
          type: integer
          minimum: 0
        workDescription:
          type: string
          minLength: 1
        diagnosis:
          type: string
          minLength: 1
      minProperties: 1
    CreateRevision:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - changes
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        changes:
          $ref: "#/components/schemas/ReportChanges"
    FieldChange:
      type: object
      additionalProperties: false
      required:
        - field
        - before
        - after
      properties:
        field:
          type: string
          enum:
            - workDescription
            - diagnosis
            - totalCost
        before:
          type:
            - string
            - integer
        after:
          type:
            - string
            - integer
    Revision:
      type: object
      additionalProperties: false
      required:
        - revisionId
        - editedBy
        - editedAt
        - changes
      properties:
        revisionId:
          type: string
          minLength: 1
        editedBy:
          type: string
          minLength: 1
        editedAt:
          type: string
          format: date-time
        changes:
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"
          minItems: 1
    RevisionCreated:
      type: object
      additionalProperties: false
      required:
        - reportId
        - version
        - revision
        - effective
      properties:
        reportId:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        revision:
          $ref: "#/components/schemas/Revision"
        effective:
          $ref: "#/components/schemas/ReportData"
    ReportView:
      type: object
      additionalProperties: false
      required:
        - reportId
        - assignmentId
        - version
        - submittedAt
        - original
        - effective
        - revisions
      properties:
        reportId:
          type: string
          minLength: 1
        assignmentId:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
        submittedAt:
          type: string
          format: date-time
        original:
          $ref: "#/components/schemas/ReportData"
        effective:
          $ref: "#/components/schemas/ReportData"
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/Revision"
    AssignmentSummary:
      type: object
      additionalProperties: false
      required:
        - assignmentId
        - driverId
        - status
        - assignedAt
        - releasedAt
        - cancellationId
      properties:
        assignmentId:
          type: string
          minLength: 1
        driverId:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - POSSIBLE
            - RELEASED
            - FINISHED
        assignedAt:
          type: string
          format: date-time
        releasedAt:
          type:
            - string
            - "null"
          format: date-time
        cancellationId:
          type:
            - string
            - "null"
    HistoryEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - type
        - occurredAt
        - assignmentId
        - cancellationId
        - resolution
      properties:
        eventId:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - ROUND_CREATED
            - OFFER_ACCEPTED
            - ASSIGNMENT_RELEASED
            - REDISPATCH_DECIDED
            - REQUEST_CANCELLED
        occurredAt:
          type: string
          format: date-time
        assignmentId:
          type:
            - string
            - "null"
        cancellationId:
          type:
            - string
            - "null"
        resolution:
          type:
            - string
            - "null"
          enum:
            - REDISPATCH
            - CANCEL_REQUEST
            - null
    RoundHistory:
      type: object
      additionalProperties: false
      required:
        - dispatchRoundId
        - sequence
        - status
        - assignments
        - events
      properties:
        dispatchRoundId:
          type: string
          minLength: 1
        sequence:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - SEARCHING
            - OFFERING
            - ASSIGNED
            - NO_CANDIDATES
            - DELIVERY_FAILED
            - NO_ACCEPT
            - ROUND_CLOSED
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentSummary"
        events:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEvent"
    DispatchHistory:
      type: object
      additionalProperties: false
      required:
        - requestId
        - currentAssignment
        - rounds
      properties:
        requestId:
          type: string
          minLength: 1
        currentAssignment:
          oneOf:
            - $ref: "#/components/schemas/AssignmentSummary"
            - type: "null"
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/RoundHistory"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - traceId
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        traceId:
          type: string
          minLength: 1
        resourceId:
          type:
            - string
            - "null"
        currentState:
          type: object
          additionalProperties: true
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - message
            properties:
              field:
                type: string
                minLength: 1
              message:
                type: string
                minLength: 1
    Id:
      type: string
      minLength: 1
      maxLength: 64
      description: 불투명 식별자. 형식은 서버가 정하며 클라이언트는 해석하지 않는다.
    NullableId:
      type: [string, "null"]
      minLength: 1
      maxLength: 64
    DateTime:
      type: string
      format: date-time
      description: 시간대가 포함된 RFC 3339.
    NullableDateTime:
      type: [string, "null"]
      format: date-time
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, size, totalElements, totalPages]
      properties:
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    WorkType:
      type: string
      enum: [EXTERIOR_LEAK, INTERIOR_LEAK, BLOCKAGE]
      description: 외벽누수, 내벽누수, 막힘. 기사 전문 분야와 같은 값을 쓴다.
    RoundStatus:
      type: string
      enum: [SEARCHING, OFFERING, ASSIGNED, NO_CANDIDATES, DELIVERY_FAILED, NO_ACCEPT, ROUND_CLOSED]
      description: >-
        NO_CANDIDATES(후보 없음), DELIVERY_FAILED(전체 전달 실패), NO_ACCEPT(전체 거절), ROUND_CLOSED(수락 없는 만료 등)는 배정 없이 종료된 회차로서
        의뢰가 OPEN으로 남고 관리자 후속 처리 대상이 된다.
    OfferStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, EXPIRED, RESPONSE_CLOSED]
    DeliveryStatus:
      type: string
      enum: [PENDING, PROVIDER_ACCEPTED, FAILED]
      description: PROVIDER_ACCEPTED는 푸시 전달 서비스 접수이며 기사의 실제 수신·확인이 아니다.
    RequestStatus:
      type: string
      enum: [OPEN, COMPLETED, CANCELLED]
    DriverAccountStatus:
      type: string
      enum: [PENDING_APPROVAL, APPROVED, REJECTED, WITHDRAWN]
    DriverAvailability:
      type: string
      enum: [READY, VACANT]
      description: READY는 작업 가능(대기), VACANT는 작업 불가(휴식). 계정이 APPROVED일 때만 배차 판단에 사용한다.
    AssignedDriver:
      type: object
      additionalProperties: false
      required: [driverId, workerName]
      properties:
        driverId: {$ref: "#/components/schemas/Id"}
        workerName: {type: string, minLength: 1, maxLength: 100}
    # ---------- 인증 ----------
    AdminLogin:
      type: object
      additionalProperties: false
      required: [loginId, password]
      properties:
        loginId: {type: string, minLength: 1, maxLength: 100}
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 200}
    AdminLoginResult:
      type: object
      additionalProperties: false
      required: [nextStep, challengeToken, challengeExpiresIn]
      properties:
        nextStep:
          type: string
          enum: [MFA_REQUIRED, MFA_ENROLLMENT_REQUIRED]
          description: MFA_REQUIRED는 인증 코드 입력, MFA_ENROLLMENT_REQUIRED는 최초 로그인으로 TOTP 등록 필요(UC-01 A1).
        challengeToken: {type: string, minLength: 1, maxLength: 2000, description: 1차 인증 통과를 증명하는 단기 토큰. API 호출용 액세스 토큰이 아니다.}
        challengeExpiresIn: {type: integer, minimum: 1, description: 초 단위.}
    MfaVerify:
      type: object
      additionalProperties: false
      required: [challengeToken, code]
      properties:
        challengeToken: {type: string, minLength: 1, maxLength: 2000}
        code: {type: string, pattern: "^[0-9]{6}$", description: 인증 앱의 TOTP 6자리.}
    MfaEnrollmentStart:
      type: object
      additionalProperties: false
      required: [challengeToken]
      properties:
        challengeToken: {type: string, minLength: 1, maxLength: 2000}
    MfaEnrollment:
      type: object
      additionalProperties: false
      required: [secret, otpauthUri, expiresIn]
      properties:
        secret: {type: string, minLength: 1, maxLength: 128, description: TOTP 시크릿. 이 응답에서만 제공하며 로그와 저장소에 남기지 않는다.}
        otpauthUri: {type: string, format: uri, maxLength: 500, description: QR 코드로 변환해 인증 앱에 등록하는 otpauth URI.}
        expiresIn: {type: integer, minimum: 1, description: 등록 완료까지 허용되는 초.}
    MfaEnrollmentConfirm:
      type: object
      additionalProperties: false
      required: [challengeToken, code]
      properties:
        challengeToken: {type: string, minLength: 1, maxLength: 2000}
        code: {type: string, pattern: "^[0-9]{6}$"}
    AuthUser:
      type: object
      additionalProperties: false
      required: [userId, userType, role]
      properties:
        userId: {$ref: "#/components/schemas/Id"}
        userType: {type: string, enum: [ADMIN, DRIVER]}
        role:
          type: [string, "null"]
          enum: [MASTER, SUB, null]
          description: 관리자 역할(마스터/부). 기사는 null. 역할별 권한 차등은 미확정.
    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresIn, refreshExpiresIn, user]
      properties:
        accessToken: {type: string, minLength: 1, maxLength: 4000}
        refreshToken: {type: string, minLength: 1, maxLength: 4000}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, minimum: 1, description: 액세스 토큰 유효 초. 수치는 미정.}
        refreshExpiresIn: {type: integer, minimum: 1}
        user: {$ref: "#/components/schemas/AuthUser"}
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 1, maxLength: 4000}
    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 1, maxLength: 4000, description: 폐기할 리프레시 토큰.}
    DriverKakaoLogin:
      type: object
      additionalProperties: false
      required: [kakaoAccessToken]
      properties:
        kakaoAccessToken: {type: string, minLength: 1, maxLength: 4000, description: 앱이 카카오 SDK로 받은 액세스 토큰. 서버가 카카오에 검증한다.}
    DriverLoginResult:
      type: object
      additionalProperties: false
      required: [accountStatus, fullAccess, rejectionReason, tokens]
      properties:
        accountStatus:
          type: string
          enum: [NOT_REGISTERED, PENDING_APPROVAL, APPROVED, REJECTED]
          description: 탈퇴(WITHDRAWN) 계정은 로그인 자체를 403으로 거부한다.
        fullAccess: {type: boolean, description: APPROVED일 때만 true. false이면 발급된 토큰은 가입 신청·상태 확인 등 제한된 API에만 사용할 수 있다.}
        rejectionReason: {type: [string, "null"], maxLength: 1000, description: REJECTED일 때만 관리자가 입력한 반려 사유.}
        tokens: {$ref: "#/components/schemas/TokenPair"}
    # ---------- 기사 가입·프로필 ----------
    SettlementAccount:
      type: object
      additionalProperties: false
      required: [bankName, accountNumber, holderName]
      properties:
        bankName: {type: string, minLength: 1, maxLength: 50}
        accountNumber: {type: string, pattern: "^[0-9*-]{6,30}$", description: 조회 응답에서는 일부가 *로 마스킹되어 반환될 수 있다.}
        holderName: {type: string, minLength: 1, maxLength: 50}
    DriverProfileFields:
      type: object
      additionalProperties: false
      description: 기사 개인정보와 배차 조건. 정산계좌와 세금계산서 이메일은 사업자가 아닌 기사 개인 명의.
      required: [workerName, phone, email, residence, vehicleNumber, settlementAccount, taxInvoiceEmail, specialties, activityRegions, equipment]
      properties:
        workerName: {type: string, minLength: 1, maxLength: 100}
        phone: {type: string, pattern: "^[0-9+-]{9,20}$"}
        email: {type: string, format: email, maxLength: 254}
        residence: {type: string, minLength: 1, maxLength: 200}
        vehicleNumber: {type: string, minLength: 1, maxLength: 20}
        settlementAccount: {$ref: "#/components/schemas/SettlementAccount"}
        taxInvoiceEmail: {type: string, format: email, maxLength: 254}
        specialties:
          type: array
          items: {$ref: "#/components/schemas/WorkType"}
          minItems: 1
          maxItems: 3
          uniqueItems: true
        activityRegions:
          type: array
          items: {type: string, minLength: 1, maxLength: 100}
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: 활동지. 지역 세부 분류 체계는 미정이라 자유 문자열로 둔 제안.
        equipment:
          type: array
          items: {type: string, minLength: 1, maxLength: 100}
          maxItems: 50
          uniqueItems: true
    BusinessInfo:
      type: object
      additionalProperties: false
      description: 사업자 정보. businessRegistrationNumber와 openedOn은 외부 사업자등록정보 검증에 필요해 추가한 설계 제안.
      required: [businessName, businessRegistrationNumber, openedOn, businessType, businessItem, representativeName, companyPhone, companyAddress]
      properties:
        businessName: {type: string, minLength: 1, maxLength: 100}
        businessRegistrationNumber: {type: string, pattern: "^[0-9]{10}$"}
        openedOn: {type: string, format: date}
        businessType: {type: string, minLength: 1, maxLength: 100, description: 업태.}
        businessItem: {type: string, minLength: 1, maxLength: 100, description: 종목.}
        representativeName: {type: string, minLength: 1, maxLength: 100}
        companyPhone: {type: string, pattern: "^[0-9+-]{9,20}$"}
        companyAddress: {type: string, minLength: 1, maxLength: 200}
    BusinessVerification:
      type: object
      additionalProperties: false
      required: [status, verifiedAt]
      properties:
        status:
          type: string
          enum: [VERIFIED, FAILED, UNAVAILABLE]
          description: UNAVAILABLE은 외부 서비스 장애이며 검증 실패(FAILED)와 구분한다.
        verifiedAt: {$ref: "#/components/schemas/NullableDateTime"}
    DriverRegistrationRequest:
      type: object
      additionalProperties: false
      required: [profile, business]
      properties:
        profile: {$ref: "#/components/schemas/DriverProfileFields"}
        business: {$ref: "#/components/schemas/BusinessInfo"}
    DriverRegistrationResult:
      type: object
      additionalProperties: false
      required: [driverId, accountStatus, submittedAt, version]
      properties:
        driverId: {$ref: "#/components/schemas/Id"}
        accountStatus: {type: string, const: PENDING_APPROVAL}
        submittedAt: {$ref: "#/components/schemas/DateTime"}
        version: {type: integer, minimum: 1}
    RegistrationRejection:
      type: object
      additionalProperties: false
      required: [reason, rejectedAt]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
        rejectedAt: {$ref: "#/components/schemas/DateTime"}
    DriverRegistrationView:
      type: object
      additionalProperties: false
      required: [driverId, accountStatus, version, submittedAt, rejection, profile, business, businessVerification]
      properties:
        driverId: {$ref: "#/components/schemas/Id"}
        accountStatus: {$ref: "#/components/schemas/DriverAccountStatus"}
        version: {type: integer, minimum: 1}
        submittedAt: {$ref: "#/components/schemas/DateTime"}
        rejection:
          oneOf:
            - $ref: "#/components/schemas/RegistrationRejection"
            - type: "null"
        profile: {$ref: "#/components/schemas/DriverProfileFields"}
        business: {$ref: "#/components/schemas/BusinessInfo"}
        businessVerification: {$ref: "#/components/schemas/BusinessVerification"}
    DriverResubmission:
      type: object
      additionalProperties: false
      required: [expectedVersion, registration]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        registration: {$ref: "#/components/schemas/DriverRegistrationRequest"}
    DriverSummary:
      type: object
      additionalProperties: false
      required: [driverId, workerName, businessName, accountStatus, submittedAt, version]
      properties:
        driverId: {$ref: "#/components/schemas/Id"}
        workerName: {type: string, minLength: 1, maxLength: 100}
        businessName: {type: string, minLength: 1, maxLength: 100}
        accountStatus: {$ref: "#/components/schemas/DriverAccountStatus"}
        submittedAt: {$ref: "#/components/schemas/DateTime"}
        version: {type: integer, minimum: 1}
    DriverList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/DriverSummary"}
        page: {$ref: "#/components/schemas/PageInfo"}
    DriverDetail:
      type: object
      additionalProperties: false
      required: [driverId, accountStatus, version, submittedAt, profile, business, businessVerification, rejectionHistory, availability]
      properties:
        driverId: {$ref: "#/components/schemas/Id"}
        accountStatus: {$ref: "#/components/schemas/DriverAccountStatus"}
        version: {type: integer, minimum: 1, description: 승인·반려 요청의 expectedVersion.}
        submittedAt: {$ref: "#/components/schemas/DateTime"}
        profile: {$ref: "#/components/schemas/DriverProfileFields"}
        business: {$ref: "#/components/schemas/BusinessInfo"}
        businessVerification: {$ref: "#/components/schemas/BusinessVerification"}
        rejectionHistory:
          type: array
          items: {$ref: "#/components/schemas/RegistrationRejection"}
          description: 재신청 이력을 포함한 과거 반려 이력.
        availability:
          oneOf:
            - $ref: "#/components/schemas/DriverAvailability"
            - type: "null"
    DriverApprovalRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, decision]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        decision: {type: string, enum: [APPROVE, REJECT]}
        rejectionReason: {type: string, minLength: 1, maxLength: 1000, description: decision이 REJECT일 때 필수.}
      if:
        properties:
          decision: {const: REJECT}
      then:
        required: [rejectionReason]
    DriverApprovalResult:
      type: object
      additionalProperties: false
      required: [driverId, accountStatus, version, decidedAt]
      properties:
        driverId: {$ref: "#/components/schemas/Id"}
        accountStatus: {type: string, enum: [APPROVED, REJECTED]}
        version: {type: integer, minimum: 1}
        decidedAt: {$ref: "#/components/schemas/DateTime"}
    AvailabilityUpdate:
      type: object
      additionalProperties: false
      required: [availability]
      properties:
        availability: {$ref: "#/components/schemas/DriverAvailability"}
    AvailabilityState:
      type: object
      additionalProperties: false
      required: [availability, accountStatus, updatedAt]
      properties:
        availability: {$ref: "#/components/schemas/DriverAvailability"}
        accountStatus: {$ref: "#/components/schemas/DriverAccountStatus"}
        updatedAt: {$ref: "#/components/schemas/DateTime"}
    LocationUpdate:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracyMeters, measuredAt]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        accuracyMeters: {type: number, minimum: 0, maximum: 100000}
        measuredAt: {$ref: "#/components/schemas/DateTime"}
    LocationIssue:
      type: object
      additionalProperties: false
      required: [issue, occurredAt]
      properties:
        issue: {type: string, enum: [PERMISSION_DENIED, UNAVAILABLE], description: 위치 권한 거부 또는 위치 획득 실패.}
        occurredAt: {$ref: "#/components/schemas/DateTime"}
    LocationState:
      type: object
      additionalProperties: false
      required: [locationUsability, lastUpdatedAt, issue]
      properties:
        locationUsability: {type: string, enum: [VALID, STALE, MISSING]}
        lastUpdatedAt: {$ref: "#/components/schemas/NullableDateTime"}
        issue:
          type: [string, "null"]
          enum: [PERMISSION_DENIED, UNAVAILABLE, null]
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [dispatchOfferPush, chatPush]
      properties:
        dispatchOfferPush: {type: boolean}
        chatPush: {type: boolean}
    DriverProfileView:
      type: object
      additionalProperties: false
      required: [driverId, accountStatus, version, profile, business, notificationSettings]
      properties:
        driverId: {$ref: "#/components/schemas/Id"}
        accountStatus: {$ref: "#/components/schemas/DriverAccountStatus"}
        version: {type: integer, minimum: 1}
        profile: {$ref: "#/components/schemas/DriverProfileFields"}
        business: {$ref: "#/components/schemas/BusinessInfo"}
        notificationSettings: {$ref: "#/components/schemas/NotificationSettings"}
    DriverProfileChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 변경할 항목만 보낸다. 사업자 정보 변경은 재검증 정책이 미정이라 이 API에서 받지 않는다.
      properties:
        workerName: {type: string, minLength: 1, maxLength: 100}
        phone: {type: string, pattern: "^[0-9+-]{9,20}$"}
        email: {type: string, format: email, maxLength: 254}
        residence: {type: string, minLength: 1, maxLength: 200}
        vehicleNumber: {type: string, minLength: 1, maxLength: 20}
        settlementAccount: {$ref: "#/components/schemas/SettlementAccount"}
        taxInvoiceEmail: {type: string, format: email, maxLength: 254}
        specialties:
          type: array
          items: {$ref: "#/components/schemas/WorkType"}
          minItems: 1
          maxItems: 3
          uniqueItems: true
        activityRegions:
          type: array
          items: {type: string, minLength: 1, maxLength: 100}
          minItems: 1
          maxItems: 20
          uniqueItems: true
        equipment:
          type: array
          items: {type: string, minLength: 1, maxLength: 100}
          maxItems: 50
          uniqueItems: true
        notificationSettings: {$ref: "#/components/schemas/NotificationSettings"}
    UpdateProfile:
      type: object
      additionalProperties: false
      required: [expectedVersion, changes]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        changes: {$ref: "#/components/schemas/DriverProfileChanges"}
    ProfileUpdated:
      type: object
      additionalProperties: false
      required: [driverId, version, updatedAt, profile, notificationSettings]
      properties:
        driverId: {$ref: "#/components/schemas/Id"}
        version: {type: integer, minimum: 1}
        updatedAt: {$ref: "#/components/schemas/DateTime"}
        profile: {$ref: "#/components/schemas/DriverProfileFields"}
        notificationSettings: {$ref: "#/components/schemas/NotificationSettings"}
    WithdrawalRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, confirmed]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        confirmed: {type: boolean, const: true, description: 유의사항 안내 후 최종 확인했음을 뜻한다.}
    WithdrawalResult:
      type: object
      additionalProperties: false
      required: [driverId, accountStatus, withdrawnAt]
      properties:
        driverId: {$ref: "#/components/schemas/Id"}
        accountStatus: {type: string, const: WITHDRAWN}
        withdrawnAt: {$ref: "#/components/schemas/DateTime"}
    # ---------- 접수 ----------
    ProcessingStatus:
      type: string
      enum: [PENDING, PROCESSING, SUCCEEDED, FAILED, NOT_AVAILABLE]
    ReceptionDraftFields:
      type: object
      additionalProperties: false
      description: 접수 정보. 확정 전에는 일부 값만 있을 수 있어 모든 필드가 선택이다. 확정 시점에 필수값을 검증한다.
      properties:
        workType: {$ref: "#/components/schemas/WorkType"}
        symptoms: {type: string, minLength: 1, maxLength: 2000}
        address: {type: string, minLength: 1, maxLength: 300}
        desiredVisitFrom: {$ref: "#/components/schemas/DateTime"}
        desiredVisitTo: {$ref: "#/components/schemas/DateTime"}
        notes: {type: string, maxLength: 2000}
    ReceptionSummary:
      type: object
      additionalProperties: false
      required: [receptionId, receivedAt, callerPhoneMasked, reviewStatus, recordingStatus, sttStatus, analysisStatus, version]
      properties:
        receptionId: {$ref: "#/components/schemas/Id"}
        receivedAt: {$ref: "#/components/schemas/DateTime"}
        callerPhoneMasked: {type: string, maxLength: 20, description: 개인정보 보호를 위해 가운데를 가린 번호.}
        reviewStatus: {type: string, enum: [DRAFT, CONFIRMED]}
        recordingStatus: {$ref: "#/components/schemas/ProcessingStatus"}
        sttStatus: {$ref: "#/components/schemas/ProcessingStatus"}
        analysisStatus: {$ref: "#/components/schemas/ProcessingStatus"}
        version: {type: integer, minimum: 1}
    ReceptionList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ReceptionSummary"}
        page: {$ref: "#/components/schemas/PageInfo"}
    ReceptionDetail:
      type: object
      additionalProperties: false
      required: [receptionId, receivedAt, callerPhoneMasked, reviewStatus, recordingStatus, sttStatus, analysisStatus, version, recordingFileId, transcript, aiOriginal, finalData, confirmedAt, requestId]
      properties:
        receptionId: {$ref: "#/components/schemas/Id"}
        receivedAt: {$ref: "#/components/schemas/DateTime"}
        callerPhoneMasked: {type: string, maxLength: 20}
        reviewStatus: {type: string, enum: [DRAFT, CONFIRMED]}
        recordingStatus: {$ref: "#/components/schemas/ProcessingStatus"}
        sttStatus: {$ref: "#/components/schemas/ProcessingStatus"}
        analysisStatus: {$ref: "#/components/schemas/ProcessingStatus"}
        version: {type: integer, minimum: 1, description: 수정·확정 요청의 expectedVersion.}
        recordingFileId:
          $ref: "#/components/schemas/NullableId"
          description: 녹음 원본이 실제로 존재할 때만 값이 있다. 재생 URL은 파일 접근 API로 받는다.
        transcript: {type: [string, "null"], maxLength: 100000, description: STT 결과. 없으면 null.}
        aiOriginal:
          description: AI가 추출한 원본. 분석 결과가 없으면 null. 관리자가 수정해도 변하지 않는다.
          oneOf:
            - $ref: "#/components/schemas/ReceptionDraftFields"
            - type: "null"
        finalData:
          $ref: "#/components/schemas/ReceptionDraftFields"
          description: 관리자가 저장한 최종 값. 아직 입력이 없으면 빈 객체.
        confirmedAt: {$ref: "#/components/schemas/NullableDateTime"}
        requestId:
          $ref: "#/components/schemas/NullableId"
          description: 이 접수로 등록된 의뢰가 있으면 그 ID.
    UpdateReception:
      type: object
      additionalProperties: false
      required: [expectedVersion, changes]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        changes:
          $ref: "#/components/schemas/ReceptionDraftFields"
          minProperties: 1
    ReceptionUpdated:
      type: object
      additionalProperties: false
      required: [receptionId, reviewStatus, version, updatedAt, finalData]
      properties:
        receptionId: {$ref: "#/components/schemas/Id"}
        reviewStatus: {type: string, const: DRAFT}
        version: {type: integer, minimum: 1}
        updatedAt: {$ref: "#/components/schemas/DateTime"}
        finalData: {$ref: "#/components/schemas/ReceptionDraftFields"}
    FileAccess:
      type: object
      additionalProperties: false
      required: [fileId, url, expiresAt, contentType]
      properties:
        fileId: {$ref: "#/components/schemas/Id"}
        url: {type: string, format: uri, maxLength: 2000, description: 단기 서명 URL. 저장하거나 공유하지 않는다.}
        expiresAt: {$ref: "#/components/schemas/DateTime"}
        contentType: {type: string, maxLength: 100}
    FileUploaded:
      type: object
      additionalProperties: false
      required: [fileId, kind, contentType, sizeBytes, uploadedAt]
      properties:
        fileId: {$ref: "#/components/schemas/Id"}
        kind: {type: string, enum: [WORK_PHOTO]}
        contentType: {type: string, maxLength: 100}
        sizeBytes: {type: integer, minimum: 1}
        uploadedAt: {$ref: "#/components/schemas/DateTime"}
    # ---------- 의뢰·배차 ----------
    OfferResult:
      type: object
      additionalProperties: false
      description: 기사별 배차 요청 결과. 전달 상태와 응답 상태는 독립적이다.
      required: [offerId, driver, offerStatus, deliveryStatus, providerAcceptedAt, receivedAt, viewedAt, respondedAt, expiresAt]
      properties:
        offerId: {$ref: "#/components/schemas/Id"}
        driver: {$ref: "#/components/schemas/AssignedDriver"}
        offerStatus: {$ref: "#/components/schemas/OfferStatus"}
        deliveryStatus: {$ref: "#/components/schemas/DeliveryStatus"}
        providerAcceptedAt: {$ref: "#/components/schemas/NullableDateTime"}
        receivedAt: {$ref: "#/components/schemas/NullableDateTime", description: 실제 수신 신호가 있을 때만 값이 있다.}
        viewedAt: {$ref: "#/components/schemas/NullableDateTime"}
        respondedAt: {$ref: "#/components/schemas/NullableDateTime"}
        expiresAt: {$ref: "#/components/schemas/DateTime"}
    RoundDetail:
      type: object
      additionalProperties: false
      required: [dispatchRoundId, sequence, status, startedAt, closedAt, offers]
      properties:
        dispatchRoundId: {$ref: "#/components/schemas/Id"}
        sequence: {type: integer, minimum: 1}
        status: {$ref: "#/components/schemas/RoundStatus"}
        startedAt: {$ref: "#/components/schemas/DateTime"}
        closedAt: {$ref: "#/components/schemas/NullableDateTime"}
        offers:
          type: array
          items: {$ref: "#/components/schemas/OfferResult"}
    DispatchRoundList:
      type: object
      additionalProperties: false
      required: [requestId, needsAdminAction, rounds]
      properties:
        requestId: {$ref: "#/components/schemas/Id"}
        needsAdminAction: {type: boolean, description: 배정 없이 회차가 종료되어 관리자 후속 배차가 필요하면 true.}
        rounds:
          type: array
          items: {$ref: "#/components/schemas/RoundDetail"}
    StartFollowUpRound:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1, description: 의뢰 상세의 version.}
    RoundStarted:
      type: object
      additionalProperties: false
      required: [requestId, dispatchRoundId, sequence, status, version]
      properties:
        requestId: {$ref: "#/components/schemas/Id"}
        dispatchRoundId: {$ref: "#/components/schemas/Id"}
        sequence: {type: integer, minimum: 2}
        status: {type: string, const: SEARCHING}
        version: {type: integer, minimum: 1, description: 갱신된 의뢰 버전.}
    CurrentAssignment:
      type: object
      additionalProperties: false
      required: [assignmentId, driver, assignmentStatus, workStatus, workUpdatedAt]
      properties:
        assignmentId: {$ref: "#/components/schemas/Id"}
        driver: {$ref: "#/components/schemas/AssignedDriver"}
        assignmentStatus: {type: string, enum: [POSSIBLE, FINISHED]}
        workStatus: {$ref: "#/components/schemas/WorkStatus"}
        workUpdatedAt: {$ref: "#/components/schemas/DateTime"}
    ServiceRequestSummary:
      type: object
      additionalProperties: false
      required: [requestId, receptionId, requestStatus, workType, address, dispatchStatus, workStatus, assignedDriver, needsAdminAction, createdAt, updatedAt, version]
      properties:
        requestId: {$ref: "#/components/schemas/Id"}
        receptionId: {$ref: "#/components/schemas/Id"}
        requestStatus: {$ref: "#/components/schemas/RequestStatus"}
        workType: {$ref: "#/components/schemas/WorkType"}
        address: {type: string, minLength: 1, maxLength: 300}
        dispatchStatus:
          description: 현재 회차 상태. 회차가 없으면 null.
          oneOf:
            - $ref: "#/components/schemas/RoundStatus"
            - type: "null"
        workStatus:
          description: 최신 작업 상태. 담당자가 없으면 null.
          oneOf:
            - $ref: "#/components/schemas/WorkStatus"
            - type: "null"
        assignedDriver:
          oneOf:
            - $ref: "#/components/schemas/AssignedDriver"
            - type: "null"
        needsAdminAction: {type: boolean}
        createdAt: {$ref: "#/components/schemas/DateTime"}
        updatedAt: {$ref: "#/components/schemas/DateTime"}
        version: {type: integer, minimum: 1}
    ServiceRequestList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ServiceRequestSummary"}
        page: {$ref: "#/components/schemas/PageInfo"}
    ServiceRequestDetail:
      type: object
      additionalProperties: false
      required: [requestId, receptionId, requestStatus, version, createdAt, completedAt, cancelledAt, reception, currentRound, currentAssignment, reportId, needsAdminAction, followUpReason]
      properties:
        requestId: {$ref: "#/components/schemas/Id"}
        receptionId: {$ref: "#/components/schemas/Id"}
        requestStatus: {$ref: "#/components/schemas/RequestStatus"}
        version: {type: integer, minimum: 1}
        createdAt: {$ref: "#/components/schemas/DateTime"}
        completedAt: {$ref: "#/components/schemas/NullableDateTime"}
        cancelledAt: {$ref: "#/components/schemas/NullableDateTime"}
        reception: {$ref: "#/components/schemas/ReceptionFields"}
        currentRound:
          description: 가장 최근 회차. 과거 회차는 dispatch-rounds와 dispatch-history로 조회한다.
          oneOf:
            - $ref: "#/components/schemas/RoundDetail"
            - type: "null"
        currentAssignment:
          description: 현재 유효 배정. 없으면 null. 과거 배정은 dispatch-history에 있다.
          oneOf:
            - $ref: "#/components/schemas/CurrentAssignment"
            - type: "null"
        reportId:
          $ref: "#/components/schemas/NullableId"
          description: 최초 보고서가 제출되었으면 그 ID, 미제출이면 null(UC-05 E1).
        needsAdminAction: {type: boolean}
        followUpReason:
          type: [string, "null"]
          enum: [NO_CANDIDATES, DELIVERY_FAILED, NO_ACCEPT, ROUND_CLOSED, null]
          description: needsAdminAction이 true인 이유.
    StatisticsMetrics:
      type: object
      additionalProperties: false
      description: 통계 지표는 미정이므로 최소 집계만 제안한다. 보고서의 최신 유효 수정 비용을 반영하고 완료 건수를 중복 집계하지 않는다.
      required: [totalRequests, openRequests, completedRequests, cancelledRequests, totalCostKrw]
      properties:
        totalRequests: {type: integer, minimum: 0}
        openRequests: {type: integer, minimum: 0}
        completedRequests: {type: integer, minimum: 0}
        cancelledRequests: {type: integer, minimum: 0}
        totalCostKrw: {type: integer, minimum: 0}
    WorkStatistics:
      type: object
      additionalProperties: false
      required: [period, hasData, metrics]
      properties:
        period:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
        hasData: {type: boolean, description: 기간에 데이터가 없으면 false. 이때 metrics는 0으로 채우지 않고 null.}
        metrics:
          oneOf:
            - $ref: "#/components/schemas/StatisticsMetrics"
            - type: "null"
    # ---------- 취소 ----------
    CancellationResolutionStatus:
      type: string
      enum: [PENDING, REDISPATCH, CANCEL_REQUEST]
    CancellationSummary:
      type: object
      additionalProperties: false
      required: [cancellationId, requestId, assignmentId, driver, reasonCode, resolutionStatus, releasedAt, resolvedAt, version]
      properties:
        cancellationId: {$ref: "#/components/schemas/Id"}
        requestId: {$ref: "#/components/schemas/Id"}
        assignmentId: {$ref: "#/components/schemas/Id"}
        driver: {$ref: "#/components/schemas/AssignedDriver"}
        reasonCode: {type: string, enum: [SCHEDULE_CONFLICT, EQUIPMENT_UNAVAILABLE, TRAVEL_ISSUE, CUSTOMER_UNREACHABLE, OTHER]}
        resolutionStatus: {$ref: "#/components/schemas/CancellationResolutionStatus"}
        releasedAt: {$ref: "#/components/schemas/DateTime"}
        resolvedAt: {$ref: "#/components/schemas/NullableDateTime"}
        version: {type: integer, minimum: 1}
    CancellationList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CancellationSummary"}
        page: {$ref: "#/components/schemas/PageInfo"}
    CancellationDetail:
      type: object
      additionalProperties: false
      required: [cancellationId, requestId, assignmentId, driver, reasonCode, reasonDetail, resolutionStatus, releasedAt, resolvedAt, version, request]
      properties:
        cancellationId: {$ref: "#/components/schemas/Id"}
        requestId: {$ref: "#/components/schemas/Id"}
        assignmentId: {$ref: "#/components/schemas/Id"}
        driver: {$ref: "#/components/schemas/AssignedDriver"}
        reasonCode: {type: string, enum: [SCHEDULE_CONFLICT, EQUIPMENT_UNAVAILABLE, TRAVEL_ISSUE, CUSTOMER_UNREACHABLE, OTHER]}
        reasonDetail: {type: string, minLength: 1, maxLength: 1000}
        resolutionStatus: {$ref: "#/components/schemas/CancellationResolutionStatus"}
        releasedAt: {$ref: "#/components/schemas/DateTime"}
        resolvedAt: {$ref: "#/components/schemas/NullableDateTime"}
        version: {type: integer, minimum: 1, description: 후속 결정(resolveCancellation)의 expectedVersion.}
        request:
          type: object
          additionalProperties: false
          description: 처리 시점의 최신 의뢰 상태. 취소 요청의 처리 상태(resolutionStatus)와 의뢰 상태는 구분한다.
          required: [requestStatus, workType, address, dispatchStatus, needsAdminAction]
          properties:
            requestStatus: {$ref: "#/components/schemas/RequestStatus"}
            workType: {$ref: "#/components/schemas/WorkType"}
            address: {type: string, minLength: 1, maxLength: 300}
            dispatchStatus:
              oneOf:
                - $ref: "#/components/schemas/RoundStatus"
                - type: "null"
            needsAdminAction: {type: boolean}
    # ---------- 보고서 ----------
    ReportListItem:
      type: object
      additionalProperties: false
      required: [reportId, requestId, assignmentId, driver, submittedAt, totalCost, revised, version]
      properties:
        reportId: {$ref: "#/components/schemas/Id"}
        requestId: {$ref: "#/components/schemas/Id"}
        assignmentId: {$ref: "#/components/schemas/Id"}
        driver: {$ref: "#/components/schemas/AssignedDriver"}
        submittedAt: {$ref: "#/components/schemas/DateTime"}
        totalCost: {type: integer, minimum: 0, description: 최신 유효 작업 비용(KRW).}
        revised: {type: boolean, description: 관리자 수정 이력이 있으면 true.}
        version: {type: integer, minimum: 1}
    ReportList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ReportListItem"}
        page: {$ref: "#/components/schemas/PageInfo"}
    # ---------- 기사 앱: 배차 요청·배정 ----------
    OfferSummary:
      type: object
      additionalProperties: false
      required: [offerId, requestId, workType, approximateAddress, distanceKm, offerStatus, expiresAt, createdAt]
      properties:
        offerId: {$ref: "#/components/schemas/Id"}
        requestId: {$ref: "#/components/schemas/Id"}
        workType: {$ref: "#/components/schemas/WorkType"}
        approximateAddress: {type: string, minLength: 1, maxLength: 100, description: 수락 전에는 상세 주소 대신 대략적인 지역만 보여준다.}
        distanceKm: {type: [number, "null"], minimum: 0, description: 위치가 유효하지 않으면 null.}
        offerStatus: {$ref: "#/components/schemas/OfferStatus"}
        expiresAt: {$ref: "#/components/schemas/DateTime"}
        createdAt: {$ref: "#/components/schemas/DateTime"}
    OfferList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/OfferSummary"}
        page: {$ref: "#/components/schemas/PageInfo"}
    OfferDetail:
      type: object
      additionalProperties: false
      required: [offerId, requestId, workType, symptoms, approximateAddress, desiredVisitFrom, desiredVisitTo, distanceKm, offerStatus, expiresAt, createdAt, respondable]
      properties:
        offerId: {$ref: "#/components/schemas/Id"}
        requestId: {$ref: "#/components/schemas/Id"}
        workType: {$ref: "#/components/schemas/WorkType"}
        symptoms: {type: string, minLength: 1, maxLength: 2000}
        approximateAddress: {type: string, minLength: 1, maxLength: 100}
        desiredVisitFrom: {$ref: "#/components/schemas/DateTime"}
        desiredVisitTo: {$ref: "#/components/schemas/DateTime"}
        distanceKm: {type: [number, "null"], minimum: 0}
        offerStatus: {$ref: "#/components/schemas/OfferStatus"}
        expiresAt: {$ref: "#/components/schemas/DateTime"}
        createdAt: {$ref: "#/components/schemas/DateTime"}
        respondable:
          type: boolean
          description: 화면 표시용 힌트. 마감(RESPONSE_CLOSED)·만료(EXPIRED) 안내 화면 구분에 쓰며, 수락 가능 여부의 최종 판단은 서버가 응답 시점에 한다.
    DriverAssignment:
      type: object
      additionalProperties: false
      required: [assignmentId, requestId, assignmentStatus, workType, symptoms, address, desiredVisitFrom, desiredVisitTo, notes, workStatus, version, updatedAt, assignedAt, reportSubmitted, allowedTransitions, canCancel, canSubmitReport]
      properties:
        assignmentId: {$ref: "#/components/schemas/Id"}
        requestId: {$ref: "#/components/schemas/Id"}
        assignmentStatus: {type: string, enum: [POSSIBLE, RELEASED, FINISHED]}
        workType: {$ref: "#/components/schemas/WorkType"}
        symptoms: {type: string, minLength: 1, maxLength: 2000}
        address: {type: string, minLength: 1, maxLength: 300, description: 배정이 유효한 기사에게만 상세 주소를 제공한다.}
        desiredVisitFrom: {$ref: "#/components/schemas/DateTime"}
        desiredVisitTo: {$ref: "#/components/schemas/DateTime"}
        notes: {type: [string, "null"], maxLength: 2000}
        workStatus: {$ref: "#/components/schemas/WorkStatus"}
        version: {type: integer, minimum: 1, description: 작업 상태 변경·취소·보고서 제출의 expectedVersion.}
        updatedAt: {$ref: "#/components/schemas/DateTime"}
        assignedAt: {$ref: "#/components/schemas/DateTime"}
        reportSubmitted: {type: boolean}
        allowedTransitions:
          type: array
          description: 지금 요청할 수 있는 transitionWork의 targetStatus. 화면 버튼 표시용 힌트이며 서버가 요청 시점에 다시 검증한다.
          items: {type: string, enum: [NOT_STARTED, EN_ROUTE, ARRIVED, IN_PROGRESS, REVISIT_REQUIRED]}
          uniqueItems: true
        canCancel: {type: boolean, description: 취소 허용 상태 여부. 허용 상태 목록은 미결정.}
        canSubmitReport: {type: boolean}
    DriverAssignmentList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/DriverAssignment"}
        page: {$ref: "#/components/schemas/PageInfo"}
    # ---------- 채팅 ----------
    ChatMessage:
      type: object
      additionalProperties: false
      required: [messageId, driverId, sender, body, sentAt, readAt]
      properties:
        messageId: {$ref: "#/components/schemas/Id"}
        driverId: {$ref: "#/components/schemas/Id"}
        sender: {type: string, enum: [ADMIN, DRIVER]}
        body: {type: string, minLength: 1, maxLength: 2000}
        sentAt: {$ref: "#/components/schemas/DateTime"}
        readAt: {$ref: "#/components/schemas/NullableDateTime"}
    SendChatMessage:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 2000}
    ChatMessagePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, readOnly]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ChatMessage"}
        nextCursor:
          $ref: "#/components/schemas/NullableId"
          description: 더 오래된 메시지가 있으면 다음 요청의 before 값. 없으면 null.
        readOnly: {type: boolean, description: 기사 계정이 활성이 아니어서 과거 이력만 읽을 수 있으면 true. 이때 메시지 전송은 거부된다.}
    ChatRoomSummary:
      type: object
      additionalProperties: false
      required: [driver, driverAccountStatus, lastMessage, unreadCount, readOnly]
      properties:
        driver: {$ref: "#/components/schemas/AssignedDriver"}
        driverAccountStatus: {$ref: "#/components/schemas/DriverAccountStatus"}
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/ChatMessage"
            - type: "null"
        unreadCount: {type: integer, minimum: 0}
        readOnly: {type: boolean}
    ChatRoomList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ChatRoomSummary"}
        page: {$ref: "#/components/schemas/PageInfo"}
    ChatReadRequest:
      type: object
      additionalProperties: false
      required: [lastReadMessageId]
      properties:
        lastReadMessageId: {$ref: "#/components/schemas/Id"}
    ChatReadState:
      type: object
      additionalProperties: false
      required: [lastReadMessageId, readAt]
      properties:
        lastReadMessageId: {$ref: "#/components/schemas/Id"}
        readAt: {$ref: "#/components/schemas/DateTime"}

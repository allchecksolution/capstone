openapi: 3.1.1
info:
  title: 올체크 업무 흐름 대표 API 초안
  version: 0.1.0
  description: >-
    2026-10-31 FR/UC 및 Figma 비교에 따른 설계 제안. 10개 대표 작업만 포함하며 전체 API 또는 구현 완료 명세가 아니다. URI, 상태 enum, HTTP 코드와 세부
    정책은 제안이다. 문서 안내는 README.md, 화면 대응은 screen-api-mapping.md, 업무 규칙과 미결정 사항은 business-rules.md 참조. 모든 변경 요청은 인증 주체+method+정규화 경로+Idempotency-Key 범위에서
    처리한다. 동일 키/본문 성공 재시도는 최초 응답 재현, 다른 본문은 409 IDEMPOTENCY_KEY_REUSED, 처리 중은 409 OPERATION_IN_PROGRESS. DB 업무
    유일성 제약은 키 보존 기간과 무관하게 유지한다. 키 보존 기간은 미확정.
    UC-04의 의뢰 현황·기간 통계·상세·회차 조회는 후속 명세이며 아래 x-uc04-inquiry-scope와 BR-08을 따른다.
x-uc04-inquiry-scope:
  requirements:
    - FR-09
    - FR-11
    - FR-12
    - FR-16
    - UC-04
    - UC-15
  businessRules:
    - BR-08
  status: 후속 명세. 아래 경로와 입력 표기는 제안이며 실행 가능한 계약이 아니다.
  plannedApis:
    - GET /service-requests
    - GET /work-statistics?from=&to=
    - GET /service-requests/{requestId}
    - GET /service-requests/{requestId}/dispatch-rounds
  description: >-
    로그인한 관리자가 하나의 화면에서 진행 중·과거 완료/취소 의뢰를 조회한다. 조회 기간과 검색·상태·작업 유형·기사·지역 조건을 조합하며,
    목록과 해당 기간의 통계를 함께 표시한다. 기간 변경은 두 조회에 함께 반영한다. 상세에는 접수 정보·작업 유형·현재 배차 상태·배정 기사·최신 작업 상태가 필요하다.
    현재 상태와 과거 배차/재배차 이력은 구분하며 최신 배차·작업 상태를 실시간 반영한다. 조회는 기존 의뢰 데이터를 변경하지 않는다.
    보고서 기반 조회·통계에는 최신 유효 수정 내용과 중복 방지 기준을, 기사 탈퇴 관련 데이터에는 UC-15 정책을 적용한다.
  emptyAndErrorHandling: >-
    데이터가 없어도 화면에 접근할 수 있다. 목록 결과 없음(E2), 기간 통계 데이터 없음(E3), 의뢰 없음(E1), 목록·통계·상세 조회 실패(E4)를 구분한다.
    빈 목록은 200과 빈 배열, 통계 데이터 없음은 200과 데이터 유무 식별 가능한 응답, 의뢰 없음은 404를 제안한다. 조회 실패를 빈 결과로 반환하지 않는다.
  dispatchDelivery: >-
    후보 미확보·전체 전달 실패를 정상 배차 진행과 구분하고 일부 전달 실패는 기사별 결과와 정상 전달된 기사의 진행 상황을 함께 제공한다.
    푸시 발행·전달 서비스 접수 성공은 실제 수신·확인 성공을 의미하지 않는다.
  undecided: >-
    필터 UI·API 방식, 검색 기준, 지역 분류, 통계 지표·계산 방식·집계 주기·집계 기준, 목록 필터의 통계 연동, 실시간 전송 방식은 미정.
    내보내기(UC-04 A2)는 선택 기능으로 정책 결정 후 명세한다.
servers:
  - url: https://api.example.invalid/api/v1
    description: 문서용 예시 주소
security:
  - bearerAuth: []
tags:
  - name: Receptions
  - name: ServiceRequests
  - name: Dispatch
  - name: Work
  - name: Cancellations
  - name: Reports
paths:
  /receptions/{receptionId}/confirmation:
    post:
      operationId: confirmReception
      x-business-rules:
        - BR-01
        - BR-02
        - BR-03
        - BR-04
      summary: 검토한 접수 정보 확정
      description: >-
        AI 원본과 finalData를 분리 저장한다. STT/AI 실패 시 수동 입력도 허용한다. 방문 종료 시각은 시작 이후여야 한다. 이미 확정된 접수의 다른 키 재확정은 409.
        구체적인 확정 후 수정 정책은 미결정.
      tags:
        - Receptions
      x-requirements:
        - FR-02
        - FR-03
        - FR-04
        - UC-02
      x-figma-node-ids:
        - "64:404"
        - "64:561"
      x-roles:
        - ADMIN
      parameters:
        - name: receptionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmReception"
            example:
              expectedVersion: 1
              finalData:
                workType: BLOCKAGE
                symptoms: 싱크대 물이 내려가지 않음
                address: 서울시 강남구 예시로 10
                desiredVisitFrom: "2026-10-31T14:00:00+09:00"
                desiredVisitTo: "2026-10-31T16:00:00+09:00"
                notes: 방문 전 연락
      responses:
        "200":
          description: 최종 접수 정보 저장 완료
          headers:
            Idempotency-Replayed:
              description: 성공 응답 재현이면 true. 최초 성공은 false 또는 생략.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmedReception"
              example:
                receptionId: rec_01
                reviewStatus: CONFIRMED
                version: 2
                confirmedAt: "2026-10-31T09:00:00+09:00"
                finalData:
                  workType: BLOCKAGE
                  symptoms: 싱크대 물이 내려가지 않음
                  address: 서울시 강남구 예시로 10
                  desiredVisitFrom: "2026-10-31T14:00:00+09:00"
                  desiredVisitTo: "2026-10-31T16:00:00+09:00"
                  notes: 방문 전 연락
        "401":
          description: 인증이 필요합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: UNAUTHENTICATED
                message: 인증이 필요합니다.
                traceId: trace_example_01
        "403":
          description: 이 작업을 수행할 권한이 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: FORBIDDEN
                message: 이 작업을 수행할 권한이 없습니다.
                traceId: trace_example_01
        "404":
          description: 리소스를 찾을 수 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: 리소스를 찾을 수 없습니다.
                traceId: trace_example_01
        "409":
          description: VERSION_CONFLICT / RECEPTION_ALREADY_CONFIRMED / 멱등성 충돌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VERSION_CONFLICT
                message: 최신 버전과 상태를 다시 조회해 주세요.
                traceId: trace_example_01
          headers:
            Retry-After:
              description: OPERATION_IN_PROGRESS일 때 재시도 대기 초. 그 외 충돌에는 생략.
              schema:
                type: integer
                minimum: 1
        "422":
          description: 필수 정보 누락 또는 방문 시각 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_FAILED
                message: 입력값을 확인해 주세요.
                traceId: trace_example_01
        "503":
          description: 일시 장애입니다. 같은 키로 재시도해 주세요.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TEMPORARILY_UNAVAILABLE
                message: 일시 장애입니다. 같은 키로 재시도해 주세요.
                traceId: trace_example_01
  /service-requests:
    post:
      operationId: createServiceRequest
      x-business-rules:
        - BR-02
        - BR-03
        - BR-04
      summary: 확정 접수로 의뢰와 최초 배차 회차 생성
      description: >-
        의뢰, 최초 회차, 탐색 outbox를 원자적으로 저장한다. 후보 탐색과 전달은 비동기. 201은 생성 성공이며 기사 수신 확인을 의미하지 않는다. 접수당 의뢰 하나는 초안 정책.
        후속 상태 조회 API는 대응표 참조.
      tags:
        - ServiceRequests
      x-requirements:
        - FR-05
        - FR-06
        - FR-07
        - UC-03
      x-figma-node-ids:
        - "2007:1180"
        - "2007:1271"
      x-roles:
        - ADMIN
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
            example:
              receptionId: rec_01
              receptionVersion: 2
      responses:
        "201":
          description: 의뢰와 탐색 회차 생성 완료
          headers:
            Idempotency-Replayed:
              description: 성공 응답 재현이면 true. 최초 성공은 false 또는 생략.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCreated"
              example:
                requestId: req_01
                requestStatus: OPEN
                dispatchRoundId: round_01
                dispatchStatus: SEARCHING
                version: 1
        "401":
          description: 인증이 필요합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: UNAUTHENTICATED
                message: 인증이 필요합니다.
                traceId: trace_example_01
        "403":
          description: 이 작업을 수행할 권한이 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: FORBIDDEN
                message: 이 작업을 수행할 권한이 없습니다.
                traceId: trace_example_01
        "404":
          description: 리소스를 찾을 수 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: 리소스를 찾을 수 없습니다.
                traceId: trace_example_01
        "409":
          description: RECEPTION_NOT_CONFIRMED / VERSION_CONFLICT / REQUEST_EXISTS / 멱등성 충돌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VERSION_CONFLICT
                message: 최신 버전과 상태를 다시 조회해 주세요.
                traceId: trace_example_01
          headers:
            Retry-After:
              description: OPERATION_IN_PROGRESS일 때 재시도 대기 초. 그 외 충돌에는 생략.
              schema:
                type: integer
                minimum: 1
        "422":
          description: 입력값을 확인해 주세요.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_FAILED
                message: 입력값을 확인해 주세요.
                traceId: trace_example_01
        "503":
          description: 일시 장애입니다. 같은 키로 재시도해 주세요.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TEMPORARILY_UNAVAILABLE
                message: 일시 장애입니다. 같은 키로 재시도해 주세요.
                traceId: trace_example_01
  /dispatch-offers/{offerId}/response:
    post:
      operationId: respondToDispatchOffer
      x-business-rules:
        - BR-02
        - BR-03
        - BR-05
      summary: 본인 배차 요청 수락 또는 거절
      description: >-
        본인 유효 요청, 활성 계정, 작업 가능 상태, 현재 작업 점유, 회차와 만료를 재검증한다. 수락은 한 트랜잭션에서 배정 생성, 다른 요청 종료, 이벤트 저장. 의뢰당 ACTIVE
        배정 최대 1개 및 기사 중복 작업 방지. REJECT는 본인 요청만 종료한다. expectedVersion 대신 서버의 현재 요청/의뢰 잠금으로 경합을 처리한다.
      tags:
        - Dispatch
      x-requirements:
        - FR-07
        - FR-08
        - UC-10
        - QUA-REL-01
      x-figma-node-ids:
        - "2237:1342"
        - "2237:1408"
        - "2237:1440"
        - "2237:1456"
      x-roles:
        - DRIVER
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferResponse"
            example:
              decision: ACCEPT
      responses:
        "200":
          description: REJECT 성공, 본인 요청 종료
          headers:
            Idempotency-Replayed:
              description: 성공 응답 재현이면 true. 최초 성공은 false 또는 생략.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferRejected"
              example:
                offerId: offer_01
                offerStatus: REJECTED
        "201":
          description: ACCEPT 성공, 확정 배정 생성
          headers:
            Idempotency-Replayed:
              description: 성공 응답 재현이면 true. 최초 성공은 false 또는 생략.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentAccepted"
              example:
                offerId: offer_01
                offerStatus: ACCEPTED
                requestId: req_01
                assignmentId: asg_01
                assignmentStatus: ACTIVE
                workStatus: NOT_STARTED
                version: 1
        "401":
          description: 인증이 필요합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: UNAUTHENTICATED
                message: 인증이 필요합니다.
                traceId: trace_example_01
        "403":
          description: 요청 대상 기사와 불일치 또는 비활성 계정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: FORBIDDEN
                message: 이 작업을 수행할 권한이 없습니다.
                traceId: trace_example_01
        "404":
          description: 리소스를 찾을 수 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: 리소스를 찾을 수 없습니다.
                traceId: trace_example_01
        "409":
          description: OFFER_CLOSED / OFFER_EXPIRED / DRIVER_UNAVAILABLE / 멱등성 충돌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: OFFER_CLOSED
                message: 다른 기사가 먼저 수락하여 요청이 마감되었습니다.
                traceId: trace_example_01
                resourceId: offer_01
                currentState:
                  offerStatus: CLOSED
          headers:
            Retry-After:
              description: OPERATION_IN_PROGRESS일 때 재시도 대기 초. 그 외 충돌에는 생략.
              schema:
                type: integer
                minimum: 1
        "422":
          description: 입력값을 확인해 주세요.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_FAILED
                message: 입력값을 확인해 주세요.
                traceId: trace_example_01
        "503":
          description: 일시 장애입니다. 같은 키로 재시도해 주세요.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TEMPORARILY_UNAVAILABLE
                message: 일시 장애입니다. 같은 키로 재시도해 주세요.
                traceId: trace_example_01
  /assignments/{assignmentId}/work-transitions:
    post:
      operationId: transitionWork
      x-business-rules:
        - BR-01
        - BR-02
        - BR-03
        - BR-06
      summary: 유효 배정 작업 상태 전이
      description: >-
        본인 ACTIVE 배정만 허용. 제안 전이: NOT_STARTED→EN_ROUTE→ARRIVED→IN_PROGRESS→COMPLETED,
        IN_PROGRESS→REVISIT_REQUIRED→IN_PROGRESS. 재방문 전이는 reason 필수. COMPLETED 후 보고서 최초 제출까지 ACTIVE 유지 정책은
        초안이다. 취소와 같은 배정 잠금으로 직렬화한다.
      tags:
        - Work
      x-requirements:
        - FR-09
        - UC-11
      x-figma-node-ids:
        - "2237:1708"
        - "2237:1817"
        - "2237:1923"
      x-roles:
        - DRIVER
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkTransition"
            example:
              expectedVersion: 3
              targetStatus: IN_PROGRESS
      responses:
        "200":
          description: 상태와 이력 저장 완료
          headers:
            Idempotency-Replayed:
              description: 성공 응답 재현이면 true. 최초 성공은 false 또는 생략.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkTransitioned"
              example:
                assignmentId: asg_01
                assignmentStatus: ACTIVE
                workStatus: IN_PROGRESS
                version: 4
                updatedAt: "2026-10-31T14:00:00+09:00"
        "401":
          description: 인증이 필요합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: UNAUTHENTICATED
                message: 인증이 필요합니다.
                traceId: trace_example_01
        "403":
          description: ASSIGNMENT_NOT_ACTIVE / 담당자 불일치
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:

    post:
      operationId: submitDriverRegistration
      summary: 기사 가입 신청(신규)
      description: >-
        카카오 로그인 후 신규 사용자가 기사 개인정보와 사업자 정보를 제출한다. 서버가 외부 사업자등록정보 서비스로 사업자 정보를 검증하고, 검증에 성공하면 계정을
        PENDING_APPROVAL로 등록하며 관리자에게 승인 요청을 알린다. 승인 전에는 배차·채팅 등 주요 기능을 쓸 수 없다. 사업자 정보가 유효하지 않으면 422(BUSINESS_INFO_INVALID),
        외부 서비스 장애로 검증할 수 없으면 503(BUSINESS_VERIFICATION_UNAVAILABLE)으로 구분한다. 이미 가입 신청이 있으면 409다.
      tags:
        - DriverAccounts
      x-business-rules:
        - BR-01

      description: >-
        작업 가능(READY) 상태의 기사 앱이 주기적으로 현재 위치를 보낸다. 서버는 최신 위치와 마지막 갱신 시각을 관리해 VALID, STALE(유효시간 초과), MISSING(위치 없음)을 구분하며
        VALID인 위치만 거리 기반 후보 선별에 쓴다. 위치 권한이 없거나 위치를 얻지 못하면 좌표 대신 issue를 보내 서버가 이 상태를 식별하게 한다(FR-06 7). 휴식(VACANT) 중에는
        앱이 전송을 멈출 수 있다. 같은 요청을 반복해도 결과가 같으므로 Idempotency-Key를 요구하지 않는다. 위치정보는 업무상 필요한 사용자만 접근할 수 있고 로그에 남기지 않는다.

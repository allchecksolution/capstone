        (DELIVERY_FAILED)는 정상 진행과 구분된 회차 상태다. 일부 기사만 전달에 실패하면 회차는 OFFERING으로 유지되고 실패한 기사만 deliveryStatus가 FAILED다.
        PROVIDER_ACCEPTED는 푸시 서비스 접수일 뿐 기사의 실제 수신이 아니며 receivedAt·viewedAt이 있을 때만 수신·확인으로 본다. 현재 상태를 "실시간으로" 반영해야 하는 화면은

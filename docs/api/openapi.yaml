openapi: 3.1.1
info:
  title: 올체크 업무 흐름 대표 API 초안
  version: 0.2.0
  license:
    name: 내부용(비공개)
    identifier: LicenseRef-Proprietary
  description: >-
    2026-10-31 FR/UC 및 Figma 비교에 따른 설계 제안. 10개 대표 작업만 포함하며 전체 API 또는 구현 완료 명세가 아니다. URI, 상태 enum, HTTP 코드와 세부
    정책은 제안이다. 문서 안내는 README.md, 화면 대응은 screen-api-mapping.md, 업무 규칙과 미결정 사항은 business-rules.md 참조. 모든 변경 요청은 인증 주체+method+정규화 경로+Idempotency-Key 범위에서
    처리한다. 동일 키/본문 성공 재시도는 최초 응답 재현, 다른 본문은 409 IDEMPOTENCY_KEY_REUSED, 처리 중은 409 OPERATION_IN_PROGRESS. DB 업무
    유일성 제약은 키 보존 기간과 무관하게 유지한다. 키 보존 기간은 미확정.
    인증 API(로그인·MFA·토큰 갱신·로그아웃)와, 같은 값을 다시 보내도 결과가 같은 상태 설정 API(작업 가능 상태·위치·채팅 읽음)는 Idempotency-Key를 받지 않는다.
    2026-11-02에 UC-01~16에 필요한 관리자 앱·기사 앱 API를 설계 제안으로 추가했다. 필드, 코드, 경로는 모두 제안이며 구현으로 확정되지 않았다.
    실시간 채팅(WebSocket)과 푸시 알림 계약, 보고서 임시 저장, 조회 결과 내보내기(UC-04 A2)는 정책 결정 후 명세한다.
    의뢰 현황·기간 통계·상세·회차 조회는 아래 x-uc04-inquiry-scope와 BR-08을 따른다.
x-uc04-inquiry-scope:
  requirements:
    - FR-09
    - FR-11
    - FR-12
    - FR-16
    - UC-04
    - UC-15
  businessRules:
    - BR-08
  status: 계약 초안 작성(2026-11-02). 아래 경로와 입력 표기는 제안이며 실행 가능한 계약이 아니다. 필터·통계 지표 등은 미결정.
  plannedApis:
    - GET /service-requests
    - GET /work-statistics?from=&to=
    - GET /service-requests/{requestId}
    - GET /service-requests/{requestId}/dispatch-rounds
  description: >-
    로그인한 관리자가 하나의 화면에서 진행 중·과거 완료/취소 의뢰를 조회한다. 조회 기간과 검색·상태·작업 유형·기사·지역 조건을 조합하며,
    목록과 해당 기간의 통계를 함께 표시한다. 기간 변경은 두 조회에 함께 반영한다. 상세에는 접수 정보·작업 유형·현재 배차 상태·배정 기사·최신 작업 상태가 필요하다.
    현재 상태와 과거 배차/재배차 이력은 구분하며 최신 배차·작업 상태를 실시간 반영한다. 조회는 기존 의뢰 데이터를 변경하지 않는다.
    보고서 기반 조회·통계에는 최신 유효 수정 내용과 중복 방지 기준을, 기사 탈퇴 관련 데이터에는 UC-15 정책을 적용한다.
  emptyAndErrorHandling: >-
    데이터가 없어도 화면에 접근할 수 있다. 목록 결과 없음(E2), 기간 통계 데이터 없음(E3), 의뢰 없음(E1), 목록·통계·상세 조회 실패(E4)를 구분한다.
    빈 목록은 200과 빈 배열, 통계 데이터 없음은 200과 데이터 유무 식별 가능한 응답, 의뢰 없음은 404를 제안한다. 조회 실패를 빈 결과로 반환하지 않는다.
  dispatchDelivery: >-
    후보 미확보·전체 전달 실패를 정상 배차 진행과 구분하고 일부 전달 실패는 기사별 결과와 정상 전달된 기사의 진행 상황을 함께 제공한다.
    푸시 발행·전달 서비스 접수 성공은 실제 수신·확인 성공을 의미하지 않는다.
  undecided: >-
    필터 UI·API 방식, 검색 기준, 지역 분류, 통계 지표·계산 방식·집계 주기·집계 기준, 목록 필터의 통계 연동, 실시간 전송 방식은 미정.
    내보내기(UC-04 A2)는 선택 기능으로 정책 결정 후 명세한다.
servers:
  - url: https://api.example.invalid/api/v1
    description: 문서용 예시 주소
  - url: http://127.0.0.1:4010
    description: Prism Mock 서버 (구현 전 확인용. 경로에 /api/v1이 붙지 않는다)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 관리자 로그인·MFA, 기사 카카오 로그인, 토큰 갱신, 로그아웃 (UC-01, UC-08)
  - name: DriverAccounts
    description: 기사 가입 신청·재신청과 관리자의 가입 승인·반려 (UC-06, UC-08)
  - name: Receptions
    description: 상담 접수 조회·수정·확정 (UC-02)
  - name: Files
    description: 비공개 파일(녹음, 작업 사진) 업로드와 접근 (UC-02, UC-05, UC-12)
  - name: ServiceRequests
    description: 의뢰 등록, 현황·상세·통계 조회, 배차 회차와 후속 배차 (UC-03, UC-04)
  - name: Dispatch
    description: 기사의 배차 요청 수락·거절 (UC-10)
  - name: Work
    description: 기사의 작업 진행 상태 변경 (UC-11)
  - name: Cancellations
    description: 기사의 배차 취소 요청과 관리자의 후속 결정 (UC-07, UC-13)
  - name: Reports
    description: 작업 보고서 제출, 조회, 수정 이력 (UC-05, UC-12)
  - name: DriverApp
    description: 기사 앱 본인 전용 API. 작업 가능 상태, 위치, 배차 요청·배정 조회, 프로필, 탈퇴 (UC-09~15)
  - name: Chat
    description: 관리자와 기사의 1:1 채팅 (UC-16)
paths:
  /receptions/{receptionId}/confirmation:
    post:
      operationId: confirmReception
      x-business-rules:
        - BR-01
        - BR-02
        - BR-03
        - BR-04
      summary: 검토한 접수 정보 확정
      description: >-
        AI 원본과 finalData를 분리 저장한다. 접수 수정·저장은 PATCH로 먼저 수행하고 확정 요청은 expectedVersion으로 지정한 저장값을 검증하여 확정한다. STT/AI 실패 시 수동 입력도 허용한다. 방문 종료 시각은 시작 이후여야 한다. 이미 확정된 접수의 다른 키 재확정은 409.
        구체적인 확정 후 수정 정책은 미결정.
      tags:
        - Receptions
      x-requirements:
        - FR-02
        - FR-03
        - FR-04
        - UC-02
      x-figma-node-ids:
        - "64:404"
        - "64:561"
      x-roles:
        - ADMIN
      parameters:
        - name: receptionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmReception"
            example:
              expectedVersion: 1
      responses:
        "200":
          description: 최종 접수 정보 저장 완료
          headers:
            Idempotency-Replayed:
              description: 성공 응답 재현이면 true. 최초 성공은 false 또는 생략.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmedReception"
              example:
                receptionId: rec_01
                reviewStatus: CONFIRMED
                version: 2
                confirmedAt: "2026-10-31T09:00:00+09:00"
                finalData:
                  workType: BLOCKAGE
                  symptoms: 싱크대 물이 내려가지 않음
                  address: 서울시 강남구 예시로 10
                  desiredVisitFrom: "2026-10-31T14:00:00+09:00"
                  desiredVisitTo: "2026-10-31T16:00:00+09:00"
                  notes: 방문 전 연락
        "401":
          description: 인증이 필요합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: UNAUTHENTICATED
                message: 인증이 필요합니다.
                traceId: trace_example_01
        "403":
          description: 이 작업을 수행할 권한이 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: FORBIDDEN
                message: 이 작업을 수행할 권한이 없습니다.
                traceId: trace_example_01
        "404":
          description: 리소스를 찾을 수 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: 리소스를 찾을 수 없습니다.
                traceId: trace_example_01
        "409":
          description: VERSION_CONFLICT / RECEPTION_ALREADY_CONFIRMED / 멱등성 충돌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VERSION_CONFLICT
                message: 최신 버전과 상태를 다시 조회해 주세요.
                traceId: trace_example_01
          headers:
            Retry-After:
              description: OPERATION_IN_PROGRESS일 때 재시도 대기 초. 그 외 충돌에는 생략.
              schema:
                type: integer
                minimum: 1
        "422":
          description: 필수 정보 누락 또는 방문 시각 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_FAILED
                message: 입력값을 확인해 주세요.
                traceId: trace_example_01
        "503":
          description: 일시 장애입니다. 같은 키로 재시도해 주세요.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TEMPORARILY_UNAVAILABLE
                message: 일시 장애입니다. 같은 키로 재시도해 주세요.
                traceId: trace_example_01
  /service-requests:
    get:
      operationId: listServiceRequests
      summary: 의뢰 현황 목록 조회(진행 중·과거 통합)
      description: >-
        진행 중인 의뢰와 과거 완료·취소된 의뢰를 한 목록에서 조회한다. 조회 기간(from, to)과 상태, 작업 유형, 기사, 지역, 검색어를 조합할 수 있다. 같은 기간으로
        getWorkStatistics를 함께 호출해 목록과 통계를 같이 갱신한다. 결과가 없으면 오류가 아니라 200과 빈 items다(UC-04 E2). 조회 실패는 빈 결과로 위장하지 않고 503으로 응답한다.
        필터 방식, 검색 대상·일치 방식, 지역 분류 체계는 미결정이라 아래 파라미터는 제안이다. 조회는 의뢰 데이터를 바꾸지 않는다.
      tags:
        - ServiceRequests
      x-business-rules:
        - BR-02
        - BR-07
        - BR-08
      x-requirements:
        - FR-09
        - FR-16
        - UC-04
      x-figma-node-ids:
        - "2015:1890"
        - "2304:7237"
      x-roles:
        - ADMIN
      parameters:
        - name: from
          in: query
          description: 접수일 기준 조회 시작일(포함). 생략하면 기간 제한 없음.
          schema: {type: string, format: date}
        - name: to
          in: query
          description: 조회 종료일(포함).
          schema: {type: string, format: date}
        - name: requestStatus
          in: query
          description: 의뢰 상태 필터.
          schema: {$ref: "#/components/schemas/RequestStatus"}
        - name: workType
          in: query
          description: 작업 유형 필터.
          schema: {$ref: "#/components/schemas/WorkType"}
        - name: driverId
          in: query
          description: 배정 기사 필터.
          schema: {$ref: "#/components/schemas/Id"}
        - name: region
          in: query
          description: 지역 필터. 지역 분류 체계는 미정이라 자유 문자열.
          schema: {type: string, minLength: 1, maxLength: 100}
        - name: needsAdminAction
          in: query
          description: true이면 후속 배차 등 관리자 처리가 필요한 의뢰만 조회.
          schema: {type: boolean}
        - name: q
          in: query
          description: 검색어. 검색 대상은 미정.
          schema: {type: string, minLength: 1, maxLength: 100}
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 의뢰 목록.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServiceRequestList"}
              examples:
                withItems:
                  summary: 결과 있음
                  value:
                    items:
                      - requestId: req_01
                        receptionId: rec_01
                        requestStatus: OPEN
                        workType: BLOCKAGE
                        address: 서울시 강남구 예시로 10
                        dispatchStatus: ASSIGNED
                        workStatus: IN_PROGRESS
                        assignedDriver: {driverId: drv_01, workerName: 홍길동}
                        needsAdminAction: false
                        createdAt: "2026-10-31T09:00:00+09:00"
                        updatedAt: "2026-10-31T14:20:00+09:00"
                        version: 4
                      - requestId: req_02
                        receptionId: rec_03
                        requestStatus: OPEN
                        workType: EXTERIOR_LEAK
                        address: 서울시 서초구 예시로 5
                        dispatchStatus: NO_CANDIDATES
                        workStatus: null
                        assignedDriver: null
                        needsAdminAction: true
                        createdAt: "2026-10-31T10:00:00+09:00"
                        updatedAt: "2026-10-31T10:05:00+09:00"
                        version: 2
                    page: {page: 1, size: 20, totalElements: 2, totalPages: 1}
                empty:
                  summary: 결과 없음(E2). 오류가 아니다
                  value:
                    items: []
                    page: {page: 1, size: 20, totalElements: 0, totalPages: 0}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    post:
      operationId: createServiceRequest
      x-business-rules:
        - BR-02
        - BR-03
        - BR-04
      summary: 확정 접수로 의뢰와 최초 배차 회차 생성
      description: >-
        의뢰, 최초 회차, 탐색 outbox를 원자적으로 저장한다. 후보 탐색과 전달은 비동기. 201은 생성 성공이며 기사 수신 확인을 의미하지 않는다. 접수당 의뢰 하나는 초안 정책.
        후속 상태 조회 API는 대응표 참조.
      tags:
        - ServiceRequests
      x-requirements:
        - FR-05
        - FR-06
        - FR-07
        - UC-03
      x-figma-node-ids:
        - "2007:1180"
        - "2007:1271"
      x-roles:
        - ADMIN
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
            example:
              receptionId: rec_01
              receptionVersion: 2
      responses:
        "201":
          description: 의뢰와 탐색 회차 생성 완료
          headers:
            Idempotency-Replayed:
              description: 성공 응답 재현이면 true. 최초 성공은 false 또는 생략.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCreated"
              example:
                requestId: req_01
                requestStatus: OPEN
                dispatchRoundId: round_01
                dispatchStatus: SEARCHING
                version: 1
        "401":
          description: 인증이 필요합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: UNAUTHENTICATED
                message: 인증이 필요합니다.
                traceId: trace_example_01
        "403":
          description: 이 작업을 수행할 권한이 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: FORBIDDEN
                message: 이 작업을 수행할 권한이 없습니다.
                traceId: trace_example_01
        "404":
          description: 리소스를 찾을 수 없습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: 리소스를 찾을 수 없습니다.
                traceId: trace_example_01
        "409":
          description: RECEPTION_NOT_CONFIRMED / VERSION_CONFLICT / REQUEST_EXISTS / 멱등성 충돌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VERSION_CONFLICT
                message: 최신 버전과 상태를 다시 조회해 주세요.
                traceId: trace_example_01
          headers:
            Retry-After:
              description: OPERATION_IN_PROGRESS일 때 재시도 대기 초. 그 외 충돌에는 생략.
              schema:
                type: integer
                minimum: 1
        "422":
          description: 입력값을 확인해 주세요.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_FAILED
                message: 입력값을 확인해 주세요.
                traceId: trace_example_01
        "503":
          description: 일시 장애입니다. 같은 키로 재시도해 주세요.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TEMPORARILY_UNAVAILABLE
                message: 일시 장애입니다. 같은 키로 재시도해 주세요.
                traceId: trace_example_01
  /dispatch-offers/{offerId}/response:
    post:
      operationId: respondToDispatchOffer

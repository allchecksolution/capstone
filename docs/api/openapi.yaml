                businessInvalid:
                  summary: 사업자 정보 검증 실패(E3)
                  value:
                    code: BUSINESS_INFO_INVALID
                    message: 사업자 정보를 확인해 주세요.
                    traceId: trace_example_01
                    fieldErrors: [{field: business.businessRegistrationNumber, message: 유효하지 않은 사업자등록번호입니다.}]
        "503":
          description: 외부 사업자등록정보 서비스 장애로 지금은 검증할 수 없다(E4). 입력 오류와 다르다.
          content:

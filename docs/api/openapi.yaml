  /driver/auth/kakao:
    post:
      operationId: driverKakaoLogin
      summary: 기사 카카오 로그인
      description: >-
        기사 앱이 카카오 SDK로 받은 액세스 토큰을 서버에 보내 로그인한다. 서버가 카카오에 토큰을 검증하고 기존 기사 계정과 연결한다.
        로그인 인증 성공과 정상 서비스 접근 권한은 구분한다. 계정 상태가 APPROVED가 아니면(NOT_REGISTERED, PENDING_APPROVAL, REJECTED) 토큰은 발급되지만
        fullAccess=false이며 가입 신청·상태 확인·재신청·로그아웃 같은 제한된 API에서만 쓸 수 있다. 탈퇴한 계정은 403으로 로그인을 막는다.
        인증 API는 Idempotency-Key를 받지 않는다.
      security: []
      tags:
        - Auth
      x-business-rules:
        - BR-01
        - BR-02
      x-requirements:
        - FR-13
        - UC-08
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DriverKakaoLogin"}
            example: {kakaoAccessToken: kakao_access_token_example}
      responses:
        "200":
          description: 인증 성공. accountStatus에 따라 앱이 다음 화면을 결정한다.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DriverLoginResult"}
              examples:
                approved:
                  summary: 활성 기사(A1). 정상 서비스 이용
                  value:
                    accountStatus: APPROVED
                    fullAccess: true
                    rejectionReason: null
                    tokens:
                      accessToken: access_token_example
                      refreshToken: refresh_token_example
                      tokenType: Bearer
                      expiresIn: 900
                      refreshExpiresIn: 1209600
                      user: {userId: drv_01, userType: DRIVER, role: null}
                newUser:
                  summary: 신규 사용자. 기사정보 입력 화면으로 이동
                  value:
                    accountStatus: NOT_REGISTERED
                    fullAccess: false
                    rejectionReason: null
                    tokens:
                      accessToken: access_token_limited_example
                      refreshToken: refresh_token_limited_example
                      tokenType: Bearer
                      expiresIn: 900
                      refreshExpiresIn: 1209600
                      user: {userId: drv_02, userType: DRIVER, role: null}
                rejected:
                  summary: 반려 기사(A3). 반려 사유 화면으로 이동
                  value:
                    accountStatus: REJECTED
                    fullAccess: false
                    rejectionReason: 사업자 정보를 다시 확인해 주세요.
                    tokens:
                      accessToken: access_token_limited_example
                      refreshToken: refresh_token_limited_example
                      tokenType: Bearer
                      expiresIn: 900
                      refreshExpiresIn: 1209600
                      user: {userId: drv_03, userType: DRIVER, role: null}
        "401":
          description: 카카오 인증에 실패했다(UC-08 E1).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example: {code: KAKAO_AUTH_FAILED, message: 카카오 로그인에 실패했습니다., traceId: trace_example_01}
        "403":
          description: 탈퇴한 계정이다(UC-08 E6).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example: {code: ACCOUNT_WITHDRAWN, message: 탈퇴한 계정으로는 로그인할 수 없습니다., traceId: trace_example_01}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /admin/auth/login:
    post:
      operationId: adminLogin
      summary: 관리자 1차 인증(아이디·비밀번호)
      description: >-
        관리자 로그인의 첫 단계다. 성공해도 관리자 기능에 접근할 수 없고, 응답의 nextStep에 따라 MFA 인증 코드 입력(/admin/auth/mfa/verify) 또는
        최초 TOTP 등록(/admin/auth/mfa/enrollment)을 진행한다. 공개 관리자 회원가입은 제공하지 않는다. 아이디와 비밀번호 중 어느 쪽이 틀렸는지는 알려주지 않는다.
        인증 API는 업무 변경 요청이 아니므로 Idempotency-Key를 받지 않는다.
      security: []
      tags:
        - Auth
      x-business-rules:
        - BR-02
      x-requirements:
        - FR-01
        - UC-01
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminLogin"}
            example: {loginId: admin01, password: example-password}
      responses:
        "200":
          description: 1차 인증 성공. 다음 단계를 안내한다.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminLoginResult"}
              examples:
                mfaRequired:
                  summary: 이미 MFA가 등록된 계정
                  value: {nextStep: MFA_REQUIRED, challengeToken: challenge_example_01, challengeExpiresIn: 300}
                enrollmentRequired:
                  summary: 최초 로그인(TOTP 미등록)
                  value: {nextStep: MFA_ENROLLMENT_REQUIRED, challengeToken: challenge_example_02, challengeExpiresIn: 300}
        "401":
          description: 아이디 또는 비밀번호가 일치하지 않는다(UC-01 E1).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example: {code: INVALID_CREDENTIALS, message: 아이디 또는 비밀번호를 확인해 주세요., traceId: trace_example_01}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /admin/auth/mfa/verify:
    post:
      operationId: adminVerifyMfa
      summary: 관리자 MFA(TOTP) 인증 코드 확인
      description: >-
        1차 인증에서 받은 challengeToken과 인증 앱의 6자리 코드를 보낸다. 성공하면 액세스·리프레시 토큰을 발급하며 이때부터 관리자 기능에 접근할 수 있다.
        코드가 틀리면 재입력을 요청하고, 코드 유효시간이 지났으면 새 코드를 입력하도록 안내한다.
      security: []
      tags:
        - Auth
      x-business-rules:
        - BR-02
      x-requirements:
        - FR-01
        - UC-01
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MfaVerify"}
            example: {challengeToken: challenge_example_01, code: "123456"}
      responses:
        "200":
          description: 인증 완료. 관리자 로그인이 끝났다.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
              example:
                accessToken: access_token_example
                refreshToken: refresh_token_example
                tokenType: Bearer
                expiresIn: 900
                refreshExpiresIn: 1209600
                user: {userId: adm_01, userType: ADMIN, role: MASTER}
        "401":
          description: MFA 코드 오류(E2), 코드 유효시간 만료(E3), 또는 challengeToken 만료.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              examples:
                codeInvalid:
                  summary: 코드가 올바르지 않음(E2)
                  value: {code: MFA_CODE_INVALID, message: 인증 코드가 올바르지 않습니다. 다시 입력해 주세요., traceId: trace_example_01}
                codeExpired:
                  summary: 코드 유효시간 만료(E3)
                  value: {code: MFA_CODE_EXPIRED, message: 인증 코드가 만료되었습니다. 새 코드를 입력해 주세요., traceId: trace_example_01}
                challengeExpired:
                  summary: 1차 인증 만료. 처음부터 다시 로그인
                  value: {code: CHALLENGE_EXPIRED, message: 로그인 시간이 만료되었습니다. 다시 로그인해 주세요., traceId: trace_example_01}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /admin/auth/mfa/enrollment:
    post:
      operationId: adminStartMfaEnrollment
      summary: 최초 로그인 TOTP 등록 시작
      description: >-
        nextStep이 MFA_ENROLLMENT_REQUIRED일 때만 호출한다(UC-01 A1). 인증 앱 등록용 시크릿과 QR 코드로 만들 otpauth URI를 돌려준다. 시크릿은 이 응답에서만
        제공하며, 같은 계정에 이미 등록된 TOTP가 있으면 409다. 등록은 /admin/auth/mfa/enrollment/confirm에서 코드를 확인해야 완료된다.
      security: []
      tags:
        - Auth
      x-business-rules:
        - BR-02
      x-requirements:
        - FR-01
        - UC-01
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MfaEnrollmentStart"}
            example: {challengeToken: challenge_example_02}
      responses:
        "200":
          description: 등록 정보.
          content:
            application/json:

        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DriverRegistrationRequest"}
            example:
              profile:
                workerName: 홍길동
                phone: "010-1234-5678"
                email: driver@example.com
                residence: 서울시 강남구
                vehicleNumber: 12가3456
                settlementAccount: {bankName: 예시은행, accountNumber: "123-456-789012", holderName: 홍길동}
                taxInvoiceEmail: tax@example.com
                specialties: [BLOCKAGE]
                activityRegions: [서울 강남구]
                equipment: [고압세척기]
              business:
                businessName: 길동설비
                businessRegistrationNumber: "1234567890"
                openedOn: "2020-01-15"
                businessType: 서비스업
                businessItem: 배관 공사
                representativeName: 홍길동
                companyPhone: "02-123-4567"
                companyAddress: 서울시 강남구 예시로 20
      responses:
        "201":
          description: 가입 신청이 접수되어 승인 대기 상태가 되었다.
          headers:
            Idempotency-Replayed:
              description: 성공 응답 재현이면 true. 최초 성공은 false 또는 생략.
              schema: {type: boolean}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DriverRegistrationResult"}
              example: {driverId: drv_02, accountStatus: PENDING_APPROVAL, submittedAt: "2026-11-02T10:00:00+09:00", version: 1}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: 이미 가입 신청한 계정(DRIVER_ALREADY_REGISTERED)이거나 멱등성 충돌이다.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example: {code: DRIVER_ALREADY_REGISTERED, message: 이미 가입 신청한 계정입니다., traceId: trace_example_01}
        "422":

name: Backend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: allcheck_ci
          POSTGRES_USER: allcheck
          POSTGRES_PASSWORD: allcheck_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U allcheck -d allcheck_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/backend/**/*.gradle.kts
            apps/backend/**/gradle.properties
            apps/backend/gradle/wrapper/gradle-wrapper.properties
      - name: Check Kotlin style, run tests, and build the JAR
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/allcheck_ci
          TEST_DATABASE_USERNAME: allcheck
          TEST_DATABASE_PASSWORD: allcheck_ci
          IDENTITY_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/allcheck_ci
          IDENTITY_TEST_DATABASE_USER: allcheck
          IDENTITY_TEST_DATABASE_PASSWORD: allcheck_ci
        run: ./gradlew --no-daemon ktlintCheck test bootJar

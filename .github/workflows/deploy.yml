name: Application CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/src/**'
      - 'apps/backend/build.gradle.kts'
      - 'apps/backend/settings.gradle.kts'
      - 'apps/backend/gradle.properties'
      - 'apps/backend/gradlew'
      - 'apps/backend/gradle/**'
      - 'apps/backend/.editorconfig'
      - 'apps/backend/Dockerfile'
      - 'apps/backend/.dockerignore'
      - 'apps/ai/app/**'
      - 'apps/ai/tests/**'
      - 'apps/ai/pyproject.toml'
      - 'apps/ai/uv.lock'
      - 'apps/ai/.python-version'
      - 'apps/ai/Dockerfile'
      - 'apps/ai/.dockerignore'
      - 'infra/scripts/deploy.sh'
      - 'infra/compose/app-data.docker-compose.yml'
      - '.github/scripts/smoke-backend-image.sh'
      - '.github/scripts/send-backend-deployment.sh'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/ai-ci.yml'
      - '.github/workflows/deploy.yml'
      - '!**/*.md'
      - '!**/*.mdx'
  workflow_dispatch:
    inputs:
      operation:
        description: Publish images from main or deploy existing images
        type: choice
        options: [publish, deploy]
        default: deploy
        required: true
      environment:
        description: Target environment for deploy
        type: choice
        options: [staging, production]
        default: staging
        required: true
      target:
        description: Services to publish or deploy
        type: choice
        options: [both, backend, ai]
        default: both
        required: true
      image_revision:
        description: Backend deploy input (full commit SHA and manifest digest) from the CD summary
        type: string
        required: false
      ai_image_revision:
        description: AI deploy input (full commit SHA and manifest digest) from the CD summary
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: backend-cd-${{ github.event_name == 'push' && 'main' || github.run_id }}
  queue: max

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.select.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select services to release
        id: select
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            printf 'target=%s\n' "$MANUAL_TARGET" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            BEFORE=$(git hash-object -w -t tree /dev/null)
          fi
          git diff --name-only --no-renames -z "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/cd-paths"

          backend=false
          ai=false
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|*.mdx) ;;
              apps/backend/src/*|apps/backend/gradle/*|apps/backend/gradle.properties|apps/backend/gradlew|\
              apps/backend/build.gradle.kts|apps/backend/settings.gradle.kts|apps/backend/.editorconfig|\
              apps/backend/Dockerfile|apps/backend/.dockerignore|\
              .github/workflows/backend-ci.yml|.github/scripts/smoke-backend-image.sh)
                backend=true ;;
              apps/ai/app/*|apps/ai/tests/*|apps/ai/pyproject.toml|apps/ai/uv.lock|apps/ai/.python-version|\
              apps/ai/Dockerfile|apps/ai/.dockerignore|.github/workflows/ai-ci.yml)
                ai=true ;;
              .github/workflows/deploy.yml|.github/scripts/send-backend-deployment.sh|\
              infra/scripts/deploy.sh|infra/compose/app-data.docker-compose.yml)
                backend=true
                ai=true ;;
            esac
          done < "$RUNNER_TEMP/cd-paths"

          case "$backend:$ai" in
            true:true) target=both ;;
            true:false) target=backend ;;
            false:true) target=ai ;;
            false:false) target=none ;;
          esac
          printf 'target=%s\n' "$target" >> "$GITHUB_OUTPUT"

  backend-ci:
    needs: changes
    if: (github.event_name == 'push' || inputs.operation == 'publish') && (needs.changes.outputs.target == 'backend' || needs.changes.outputs.target == 'both')
    uses: ./.github/workflows/backend-ci.yml

  ai-ci:
    needs: changes
    if: (github.event_name == 'push' || inputs.operation == 'publish') && (needs.changes.outputs.target == 'ai' || needs.changes.outputs.target == 'both')
    uses: ./.github/workflows/ai-ci.yml

  publish:
    needs: [changes, backend-ci, ai-ci]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          ((needs.changes.outputs.target == 'both' && needs.backend-ci.result == 'success' && needs.ai-ci.result == 'success') ||
           (needs.changes.outputs.target == 'backend' && needs.backend-ci.result == 'success') ||
           (needs.changes.outputs.target == 'ai' && needs.ai-ci.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backend_image_revision: ${{ steps.push.outputs.backend_image_revision }}
      ai_image_revision: ${{ steps.push.outputs.ai_image_revision }}
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_TARGET: ${{ needs.changes.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image coordinates
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image_repository="ghcr.io/$repository"
          {
            printf 'IMAGE_REPOSITORY=%s\n' "$image_repository"
            printf 'BACKEND_IMAGE=%s-backend:%s\n' "$image_repository" "$GITHUB_SHA"
            printf 'AI_IMAGE=%s-ai:%s\n' "$image_repository" "$GITHUB_SHA"
          } >> "$GITHUB_ENV"
      - name: Build release images
        run: |
          for component in backend ai; do
            [[ "$DEPLOY_TARGET" == both || "$DEPLOY_TARGET" == "$component" ]] || continue
            docker buildx build --load --platform linux/amd64 --target runtime \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$IMAGE_REPOSITORY-$component:$GITHUB_SHA" "apps/$component"
          done
      - name: Check production readiness with PostGIS
        if: needs.changes.outputs.target != 'ai'
        run: bash .github/scripts/smoke-backend-image.sh "$BACKEND_IMAGE"
      - name: Check AI container health
        if: needs.changes.outputs.target != 'backend'
        run: |
          container=$(docker run -d --platform linux/amd64 "$AI_IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          deadline=$((SECONDS + 60))
          until [[ "$(docker inspect -f '{{.State.Health.Status}}' "$container")" == healthy ]]; do
            if (( SECONDS >= deadline )) || [[ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]]; then
              docker logs "$container" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Publish the tested images
        id: push
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for component in backend ai; do
            [[ "$DEPLOY_TARGET" == both || "$DEPLOY_TARGET" == "$component" ]] || continue
            image="$IMAGE_REPOSITORY-$component:$GITHUB_SHA"
            push_result=$(docker push "$image")
            printf '%s\n' "$push_result"
            digest=$(awk '$2 == "digest:" { print $3 }' <<< "$push_result")
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::GHCR did not return a $component manifest digest."
              exit 1
            fi
            printf '%s_image_revision=%s@%s\n' "$component" "$GITHUB_SHA" "$digest" >> "$GITHUB_OUTPUT"
            printf '%s image: \x60%s@%s\x60\n\nDeploy input: \x60%s@%s\x60\n\n' \
              "$component" "$image" "$digest" "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    needs: [changes, publish]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          ((github.event_name == 'push' && needs.publish.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
    concurrency:
      group: backend-deploy-${{ github.event_name == 'push' && 'staging' || inputs.environment }}
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: backend-deploy-${{ github.run_id }}
      - name: Send deployment and check the SSM result
        env:
          DEPLOY_TARGET: ${{ needs.changes.outputs.target }}
          IMAGE_REVISION: ${{ github.event_name == 'push' && needs.publish.outputs.backend_image_revision || inputs.image_revision }}
          AI_IMAGE_REVISION: ${{ github.event_name == 'push' && needs.publish.outputs.ai_image_revision || inputs.ai_image_revision }}
          BACKEND_INSTANCE_ID: ${{ vars.BACKEND_INSTANCE_ID }}
          BACKEND_RUNTIME_SECRET_ARN: ${{ vars.BACKEND_RUNTIME_SECRET_ARN }}
          AI_RUNTIME_SECRET_ARN: ${{ vars.AI_RUNTIME_SECRET_ARN }}
          BACKEND_GHCR_PULL_SECRET_ARN: ${{ vars.BACKEND_GHCR_PULL_SECRET_ARN }}
        run: bash .github/scripts/send-backend-deployment.sh
      - name: Check public HTTPS readiness
        if: needs.changes.outputs.target != 'ai'
        shell: bash
        env:
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
        run: |
          if [[ -z "$BACKEND_PUBLIC_URL" ]]; then
            echo "Public readiness check skipped because BACKEND_PUBLIC_URL is unset."
            exit 0
          fi
          if [[ ! "$BACKEND_PUBLIC_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?/?$ ]]; then
            echo "::error::BACKEND_PUBLIC_URL must be an HTTPS origin."
            exit 1
          fi
          curl --proto '=https' -fsS --max-time 10 --retry 4 --retry-connrefused \
            "${BACKEND_PUBLIC_URL%/}/actuator/health/readiness" | jq -e '.status == "UP"' >/dev/null

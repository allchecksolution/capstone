name: AI tests

on:
  pull_request:
    paths:
      - 'apps/ai/**'
      - '.github/workflows/ai-tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.7'
      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Run AI tests
        run: |
          unset OPENAI_API_KEY
          uv run --no-sync python -m pytest -W error::DeprecationWarning -p no:cacheprovider

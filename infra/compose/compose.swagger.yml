name: allcheck-swagger # compose.local.yml과 프로젝트를 분리해 서로의 컨테이너를 건드리지 않게 한다.

services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.18.2
    container_name: allcheck-swagger-ui
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080" # 호스트포트:컨테이너포트 (http://localhost:8081 로 접속)

    environment:
      SWAGGER_JSON: /spec/openapi.yaml # 아래 볼륨으로 연결한 원본 명세
      DISPLAY_REQUEST_DURATION: "true"
      PERSIST_AUTHORIZATION: "true" # 새로고침해도 Authorize 값 유지

    volumes:
      # 파일이 아니라 폴더를 연결하므로 명세를 저장하면 컨테이너를 다시 만들지 않고 새로고침만으로 반영된다.
      - ../../docs/api:/spec:ro

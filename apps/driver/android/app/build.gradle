plugins { id 'com.android.application' }
android {
    namespace 'kr.allcheck.driver'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'kr.allcheck.driver'; minSdk 26; targetSdk 36; versionCode 2; versionName '0.2.0' }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/driverAssets') } }
}
tasks.register('syncDriverAssets', Copy) {
    from('../..') { include 'index.html', 'app.js', 'model.js', 'flow-catalog.js', 'style.css', 'assets/**' }
    into layout.buildDirectory.dir('generated/driverAssets/www')
}
tasks.named('preBuild').configure { dependsOn 'syncDriverAssets' }
dependencies { implementation 'androidx.webkit:webkit:1.14.0' }

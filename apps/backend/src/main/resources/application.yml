server:
  port: 8080

spring:
  application:
    name: backend
  profiles:
    default: local # 기본 프로파일 local , 배포 환경에서는 dockerfile을 통해 prod로 변경

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate # 스키마 검증만 수행, 수정은 flyway 마이그레이션을 통해 수행
    open-in-view: false # Spring OSIV 비활성화

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      probes:
        enabled: true
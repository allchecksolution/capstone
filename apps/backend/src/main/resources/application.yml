server:
  port: 8080

spring:
  application:
    name: backend
  profiles:
    default: local # 배포 환경에서는 SPRING_PROFILES_ACTIVE=prod로 지정
  modulith:
    detection-strategy: explicitly-annotated # @ApplicationModule이 선언된 패키지만 Spring Modulith 모듈로 인식

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate # 스키마 검증만 수행, 수정은 flyway 마이그레이션을 통해 수행
    open-in-view: false # Spring OSIV 비활성화

springdoc:
   api-docs:
     enabled: false
   swagger-ui:
     enabled: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}

storage:
  s3:
    enabled: ${S3_ENABLED:false}
    region: ${S3_REGION:}
    request-timeout: ${S3_REQUEST_TIMEOUT:}

notification:
  fcm:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FCM_PROJECT_ID:}
    connect-timeout: ${FCM_CONNECT_TIMEOUT:}
    request-timeout: ${FCM_REQUEST_TIMEOUT:}

reception:
  push:
    enabled: ${RECEPTION_PUSH_ENABLED:false}
    max-attempts: ${RECEPTION_PUSH_MAX_ATTEMPTS:3}
    retry-delay: ${RECEPTION_PUSH_RETRY_DELAY:1m}
  ai:
    enabled: ${RECEPTION_AI_ENABLED:false}
  worker:
    enabled: ${RECEPTION_WORKER_ENABLED:false}
  recording:
    bucket: ${RECEPTION_RECORDING_BUCKET:}
    upload-url-ttl: ${RECEPTION_RECORDING_UPLOAD_URL_TTL:15m}
    playback-url-ttl: ${RECEPTION_RECORDING_PLAYBACK_URL_TTL:10m}
    ai-download-url-ttl: ${RECEPTION_RECORDING_AI_DOWNLOAD_URL_TTL:10m}

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-ai"
version = "0.1.0"
description = "Capstone AI FastAPI service"
requires-python = "==3.13.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=2,<3",
    "pydantic>=2.10,<3.0",
    "tzdata>=2025.2,<2027",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8.3,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.13.7"
